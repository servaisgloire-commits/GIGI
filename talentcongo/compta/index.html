r la suppression ?'))return;const {error}=await sb.from(t).delete().eq('id',id);if(error)toast(error.message,true);else{toast('Suppression enregistrée.');await load()}}function newInvoice(){const clients=customersList(),s=(state.d.settings||[])[0]||{};if(!clients.length){toast('Aucun client actif.',true);return}modal('Nouvelle facture',`<div class="grid"><div><label>N° facture</label><input id="fn" placeholder="TC-2026-001"></div><div><label>Client</label><select id="fc">${opt(clients)}</select></div><div><label>Date émission</label><input id="fi" type="date"></div><div><label>Échéance</label><input id="fd" type="date"></div><div class="full"><label>Objet / prestation</label><input id="fo" placeholder="Mise à disposition de personnel - septembre 2026"></div><div><label>Quantité</label><input id="fq" type="number" value="1"></div><div><label>Prix unitaire HT</label><input id="fu" type="number" value="0"></div><div><label>Taux taxe (%)</label><input id="ft" type="number" value="${Number(s.default_tax_rate||0)}"></div><div><label>Statut</label><select id="fs"><option>draft</option><option>sent</option><option>paid</option></select></div><div class="full calc" id="calc"></div><div class="full"><button id="save" class="btn green">Créer la facture</button></div></div>`);const calc=()=>{const q=Number($('fq').value)||0,u=Number($('fu').value)||0,t=Number($('ft').value)||0,ht=q*u,tax=ht*t/100,ttc=ht+tax;$('calc').textContent=`HT ${money(ht)} · Taxe ${money(tax)} · TTC ${money(ttc)}`;return{q,u,t,ht,tax,ttc}};['fq','fu','ft'].forEach(i=>$(i).oninput=calc);calc();$('save').onclick=async()=>{try{const c=clients.find(x=>x.id===$('fc').value),v=calc();const rows=await save('tc_invoices',{invoice_number:$('fn').value,company_account_id:$('fc').value,customer_name:c?.display_name||'',customer_address:'',customer_registration:'',issue_date:$('fi').value||new Date().toISOString().slice(0,10),due_date:$('fd').value||null,amount_ht:v.ht,tax_amount:v.tax,amount_ttc:v.ttc,currency:'XAF',status:$('fs').value,payment_terms:$('fd').value?`Échéance au ${$('fd').value}`:''});if(rows?.[0])await sb.from('tc_invoice_lines').insert({invoice_id:rows[0].id,description:$('fo').value,quantity:v.q,unit_price:v.u,tax_rate:v.t,line_ht:v.ht,line_tax:v.tax,line_ttc:v.ttc});toast('Facture créée dans Supabase.')}catch(e){toast(e.message,true)}}}function newPayment(){const clients=customersList();if(!clients.length){toast('Aucun client actif.',true);return}modal('Nouvel encaissement',`<div class="grid"><div><label>Client</label><select id="fc">${opt(clients)}</select></div><div><label>Référence</label><input id="fr"></div><div><label>Montant</label><input id="fa" type="number"></div><div><label>Échéance</label><input id="fd" type="date"></div><div><label>Statut</label><select id="fs"><option>a_payer</option><option>partiel</option><option>paye</option></select></div><div class="full"><button id="save" class="btn green">Enregistrer</button></div></div>`);$('save').onclick=()=>save('tc_payments',{company_account_id:$('fc').value,reference:$('fr').value,amount:Number($('fa').value)||0,due_date:$('fd').value||null,status:$('fs').value,paid_at:$('fs').value==='paye'?new Date().toISOString():null,currency:'XAF'}).catch(e=>toast(e.message,true))}function newCommission(){const clients=customersList();modal('Nouvelle commission',`<div class="grid"><div><label>Client</label><select id="fc">${opt(clients)}</select></div><div><label>Libellé</label><input id="fl"></div><div><label>Base</label><input id="fb" type="number"></div><div><label>Taux (%)</label><input id="fr" type="number"></div><div><label>Échéance</label><input id="fd" type="date"></div><div><label>Statut</label><select id="fs"><option>a_recevoir</option><option>partiel</option><option>recu</option></select></div><div class="full calc" id="calc"></div><div class="full"><button id="save" class="btn green">Créer</button></div></div>`);const calc=()=>{const b=Number($('fb').value)||0,r=Number($('fr').value)||0,c=b*r/100;$('calc').textContent='Commission : '+money(c);return c};['fb','fr'].forEach(i=>$(i).oninput=calc);calc();$('save').onclick=()=>save('tc_commissions',{company_account_id:$('fc').value||null,label:$('fl').value,basis_amount:Number($('fb').value)||0,rate:Number($('fr').value)||0,commission_amount:calc(),due_date:$('fd').value||null,status:$('fs').value,received_at:$('fs').value==='recu'?new Date().toISOString():null}).catch(e=>toast(e.message,true))}function newExpense(){modal('Nouvelle dépense',`<div class="grid"><div><label>Libellé</label><input id="fl"></div><div><label>Catégorie</label><input id="fc"></div><div><label>Montant</label><input id="fa" type="number"></div><div><label>Date</label><input id="fd" type="date"></div><div><label>Moyen de paiement</label><input id="fm"></div><div><label>Référence</label><input id="fr"></div><div><label>Statut</label><select id="fs"><option>draft</option><option>approved</option><option>paid</option></select></div><div class="full"><button id="save" class="btn green">Créer</button></div></div>`);$('save').onclick=()=>save('tc_expenses',{label:$('fl').value,category:$('fc').value,amount:Number($('fa').value)||0,expense_date:$('fd').value||new Date().toISOString().slice(0,10),payment_method:$('fm').value,reference:$('fr').value,status:$('fs').value,currency:'XAF'}).catch(e=>toast(e.message,true))}function newEntry(){modal('Nouvelle écriture',`<div class="grid"><div><label>Date</label><input id="fd" type="date"></div><div><label>Journal</label><select id="fj"><option>VE</option><option>AC</option><option>BQ</option><option>CA</option><option>OD</option></select></div><div><label>Compte</label><input id="fa"></div><div><label>Libellé compte</label><input id="fal"></div><div><label>N° pièce</label><input id="fp"></div><div><label>Description</label><input id="fdesc"></div><div><label>Débit</label><input id="fdeb" type="number" value="0"></div><div><label>Crédit</label><input id="fcre" type="number" value="0"></div><div><label>Statut</label><select id="fs"><option>brouillon</option><option>validé</option></select></div><div class="full"><button id="save" class="btn green">Enregistrer</button></div></div>`);$('save').onclick=()=>save('tc_accounting_entries',{entry_date:$('fd').value||new Date().toISOString().slice(0,10),journal:$('fj').value,account_code:$('fa').value,account_label:$('fal').value,piece_number:$('fp').value,description:$('fdesc').value,debit:Number($('fdeb').value)||0,credit:Number($('fcre').value)||0,status:$('fs').value}).catch(e=>toast(e.message,true))}async function pdf(id){const x=inv(id),s=(state.d.settings||[])[0]||{};if(!x)return;const {data:lines}=await sb.from('tc_invoice_lines').select('*').eq('invoice_id',id).order('sort_order');const {jsPDF}=window.jspdf,doc=new jsPDF();doc.setFontSize(18);doc.text(s.legal_name||'TalentCongo',18,20);doc.setFontSize(9);doc.text([s.address||'',`${s.city||'Brazzaville'} - ${s.country||'République du Congo'}`,s.rccm?`RCCM : ${s.rccm}`:'',s.niu?`NIU : ${s.niu}`:'',s.phone_display||'',s.email||''].filter(Boolean),18,28);doc.setFontSize(16);doc.text(`FACTURE ${x.invoice_number}`,125,22);doc.setFontSize(10);doc.text(`Date : ${date(x.issue_date)}`,125,30);doc.text(`Échéance : ${date(x.due_date)}`,125,36);doc.setFontSize(11);doc.text('Client',18,62);doc.setFontSize(10);doc.text([x.customer_name||cust(x.company_account_id)?.display_name||'Client',x.customer_address||'',x.customer_registration||''].filter(Boolean),18,69);let y=92;doc.setFontSize(9);doc.text('DESCRIPTION',18,y);doc.text('QTÉ',115,y);doc.text('PU HT',135,y);doc.text('TOTAL HT',170,y);doc.line(18,y+3,195,y+3);y+=10;(lines||[]).forEach(l=>{doc.text(String(l.description||''),18,y,{maxWidth:90});doc.text(String(l.quantity||0),115,y);doc.text(money(l.unit_price).replace(' XAF',''),135,y);doc.text(money(l.line_ht).replace(' XAF',''),170,y);y+=9});if(!(lines||[]).length){doc.text('Prestation TalentCongo',18,y);doc.text('1',115,y);doc.text(money(x.amount_ht).replace(' XAF',''),135,y);doc.text(money(x.amount_ht).replace(' XAF',''),170,y);y+=9}y=Math.max(y+8,135);doc.line(120,y,195,y);doc.text('Total HT',135,y+8);doc.text(money(x.amount_ht),168,y+8);doc.text('Taxes',135,y+16);doc.text(money(x.tax_amount),168,y+16);doc.setFontSize(11);doc.text('TOTAL TTC',135,y+26);doc.text(money(x.amount_ttc),168,y+26);doc.setFontSize(8);doc.text(x.payment_terms||'',18,260);doc.text(s.invoice_footer||'Merci pour votre confiance.',18,272);doc.save(`TalentCongo_Facture_${x.invoice_number}.pdf`);await sb.from('tc_invoices').update({pdf_generated_at:new Date().toISOString()}).eq('id',id);toast('Facture PDF générée.')}function live(){sb.channel('compta-live').on('postgres_changes',{event:'*',schema:'public'},()=>{clearTimeout(live.t);live.t=setTimeout(load,400)}).subscribe()}window.CO={newInvoice,newPayment,newCommission,newExpense,newEntry,pdf,remove};$('login').onclick=login;$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};$('refresh').onclick=load;$('menu').onclick=()=>document.querySelector('.side').classList.toggle('open');$('mclose').onclick=close;$('modal').onclick=e=>{if(e.target===$('modal'))close()};nav();go('dash');session().then(s=>s&&enter());
