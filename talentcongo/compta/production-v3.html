<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071b2e"><title>TalentCongo ERP Comptabilité</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script><style>:root{--g:#006233;--y:#fbde00;--r:#d21034;--n:#071b2e;--bg:#f5f7f8;--line:#e1e7e4;--mut:#667085}*{box-sizing:border-box}body{margin:0;font:14px Inter,Arial,sans-serif;background:var(--bg);color:var(--n)}button,input,select,textarea{font:inherit}.flag{height:6px;background:linear-gradient(135deg,var(--g) 0 43%,var(--y) 43% 57%,var(--r) 57%)}.hidden{display:none!important}.auth{min-height:calc(100vh - 6px);display:grid;place-items:center;padding:20px;background:linear-gradient(120deg,#071b2ee8,#0c4555d8)}.authbox{width:min(470px,94vw);background:#fff;border-radius:20px;padding:28px;box-shadow:0 25px 70px #0004}.brand{display:flex;align-items:center;gap:12px}.brand img{width:180px;max-width:70%}h1,h2,h3{margin:0 0 10px}.muted{color:var(--mut)}label{display:block;font-size:11px;font-weight:800;margin:12px 0 5px}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd8d1;border-radius:9px;background:#fff}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer}.primary{background:var(--n);color:#fff}.green{background:var(--g);color:#fff}.ghost{background:#fff;border:1px solid #cad7d1}.danger{background:#fff0f1;color:#a8172e}.wide{width:100%;margin-top:14px}.msg{margin-top:10px;font-size:12px}.bad{color:#b42318}.ok{color:#067647}.app{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 6px)}aside{background:#fff;border-right:1px solid var(--line);padding:16px;position:sticky;top:0;height:calc(100vh - 6px);overflow:auto}aside .brand{margin-bottom:18px}.grp{font-size:10px;color:#7b8c84;font-weight:900;text-transform:uppercase;margin:18px 8px 6px}.nav{width:100%;border:0;background:transparent;padding:10px;border-radius:9px;text-align:left;font-weight:750;cursor:pointer}.nav:hover,.nav.active{background:#eef3f5;color:var(--n)}header{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:10px;position:sticky;top:0;z-index:5}.grow{flex:1}.content{padding:20px}.hero{background:linear-gradient(135deg,#071b2e,#0c4555);color:#fff;border-radius:16px;padding:20px;display:flex;justify-content:space-between;align-items:center;gap:12px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px #071b2e0d}.card{padding:16px}.card small{color:#667085;font-weight:800;text-transform:uppercase;font-size:10px}.card b{display:block;font-size:25px;margin-top:7px}.panel{margin-top:14px;overflow:hidden}.panelhead{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:10px 11px;border-bottom:1px solid #edf1ef;text-align:left;font-size:11px}th{background:#f6f8f7;text-transform:uppercase;color:#56665d}.actions{display:flex;gap:6px;flex-wrap:wrap}.pill{display:inline-block;border-radius:999px;padding:5px 8px;background:#eef4f1;font-weight:800}.modal{position:fixed;inset:0;background:#071b2e77;display:grid;place-items:center;padding:18px;z-index:20}.modalbox{width:min(780px,96vw);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.menu{display:none}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.app{display:block}aside{position:fixed;left:-290px;width:270px;z-index:15;transition:.2s}aside.open{left:0}.menu{display:inline-block}.cards,.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="flag"></div><section id="auth" class="auth"><div class="authbox"><div class="brand"><img src="https://cdn.jsdelivr.net/gh/servaisgloire-commits/GIGI@main/talentcongo/assets/logo.svg" alt="TalentCongo"></div><div id="loginBox"><h2 style="margin-top:24px">Connexion ERP Comptabilité</h2><p class="muted">Clients, factures, encaissements, dépenses et exports.</p><label>E-mail</label><input id="email" type="email" autocomplete="username"><label>Mot de passe</label><input id="password" type="password" autocomplete="current-password"><button id="login" class="btn primary wide">Se connecter</button><button id="showSetup" class="btn ghost wide">Créer le premier administrateur</button><div id="notice" class="msg"></div></div><div id="setupBox" class="hidden"><h2 style="margin-top:24px">Premier administrateur</h2><p class="muted">Compte commun aux ERP RH et Comptabilité.</p><label>Nom</label><input id="sname" value="Administrateur TalentCongo"><label>E-mail</label><input id="semail" type="email"><label>Mot de passe</label><input id="spass" type="password" minlength="10"><button id="createAdmin" class="btn primary wide">Créer le compte principal</button><button id="backLogin" class="btn ghost wide">Retour connexion</button><div id="snotice" class="msg"></div></div></div></section><section id="app" class="app hidden"><aside><div class="brand"><img src="https://cdn.jsdelivr.net/gh/servaisgloire-commits/GIGI@main/talentcongo/assets/logo.svg" alt="TalentCongo"></div><div id="nav"></div><button id="logout" class="nav danger">Déconnexion</button></aside><main><header><button id="menu" class="btn ghost menu">☰</button><div><b id="title">Tableau de bord comptable</b><div class="muted" style="font-size:11px">Supabase FindZone · Production</div></div><div class="grow"></div><button id="refresh" class="btn ghost">Actualiser</button></header><div class="content"><section id="page"></section></div></main></section><div id="modal" class="modal hidden"><div class="modalbox"><div class="toolbar"><h3 id="mtitle" class="grow"></h3><button id="mclose" class="btn ghost">Fermer</button></div><div id="mbody"></div></div></div><script>const BASE='https://ioffjwxfxrqvxttbjeok.supabase.co',KEY='sb_publishable_52lG_rrc0j4MG6a0hrCWcQ_oVdqNVvS';const sb=supabase.createClient(BASE,KEY,{auth:{persistSession:true,autoRefreshToken:true}}),$=x=>document.getElementById(x);const defs={dash:['Tableau de bord','Pilotage'],customers:['Clients','Ventes','tc_accounts'],invoices:['Factures','Ventes','tc_invoices'],payments:['Encaissements','Ventes','tc_payments'],commissions:['Commissions','Ventes','tc_commissions'],expenses:['Dépenses','Achats','tc_expenses'],journal:['Journal comptable','Comptabilité','tc_accounting_entries'],settings:['Paramètres facture','Configuration','tc_settings'],exports:['Exports PDF / Excel','Configuration']};const S={d:{},page:'dash',profile:null};const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const money=v=>Number(v||0).toLocaleString('fr-FR')+' XAF',date=v=>v?new Date(v).toLocaleDateString('fr-FR'):'—';function msg(id,t,b=false){$(id).className='msg '+(b?'bad':'ok');$(id).textContent=t}async function firstAdminAvailable(){const {data,error}=await sb.rpc('tc_admin_setup_available');if(error)throw error;return !!data}async function login(){const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return msg('notice','Connexion refusée : '+error.message,true);enter()}async function createAdmin(){try{if(!(await firstAdminAvailable()))throw Error('Un administrateur existe déjà.');const email=$('semail').value.trim(),password=$('spass').value,name=$('sname').value.trim();if(!email.includes('@')||password.length<10)throw Error('E-mail valide et mot de passe de 10 caractères minimum.');let ok=false;try{const r=await fetch(BASE+'/functions/v1/talentcongo-first-admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password,display_name:name})});if(r.ok)ok=true}catch(e){}if(!ok){const {data,error}=await sb.auth.signUp({email,password});if(error)throw error;if(!data.session)throw Error('Compte créé. Confirmez l’e-mail puis reconnectez-vous pour terminer l’activation.');const {error:claim}=await sb.rpc('tc_claim_first_admin',{p_display_name:name});if(claim)throw claim}msg('snotice','Administrateur créé. Vous pouvez vous connecter.');setTimeout(()=>{$('setupBox').classList.add('hidden');$('loginBox').classList.remove('hidden');$('email').value=email},500)}catch(e){msg('snotice',e.message||String(e),true)}}async function enter(){const {data:{session}}=await sb.auth.getSession();if(!session)return;const {data:p,error}=await sb.from('tc_admin_profiles').select('*').eq('user_id',session.user.id).maybeSingle();if(error||!p||!p.is_active||!['super_admin','admin','finance'].includes(p.role))return msg('notice','Accès comptabilité non autorisé.',true);S.profile=p;$('auth').classList.add('hidden');$('app').classList.remove('hidden');await load()}function nav(){let g='';$('nav').innerHTML=Object.entries(defs).map(([k,d])=>{let h='';if(d[1]!==g){g=d[1];h=`<div class="grp">${g}</div>`}return h+`<button class="nav" data-p="${k}">${d[0]}</button>`}).join('');document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>go(b.dataset.p))}async function q(t,ord='created_at'){const {data,error}=await sb.from(t).select('*').order(ord,{ascending:false});if(error)throw error;return data||[]}async function load(){const map={customers:'tc_accounts',invoices:'tc_invoices',payments:'tc_payments',commissions:'tc_commissions',expenses:'tc_expenses',journal:'tc_accounting_entries',settings:'tc_settings'};for(const [k,t] of Object.entries(map)){try{S.d[k]=await q(t,k==='settings'?'id':'created_at')}catch(e){S.d[k]=[]}}render()}function go(p){S.page=p;$('title').textContent=defs[p][0];document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('active',b.dataset.p===p));render();document.querySelector('aside').classList.remove('open')}function hero(t,s,a=''){return `<div class="hero"><div><h2>${t}</h2><div>${s}</div></div><div class="toolbar">${a}</div></div>`}function tbl(cols,rows){return `<div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${cols.length}" class="muted">Aucune donnée.</td></tr>`}</tbody></table></div>`}function panel(t,b){return `<div class="panel"><div class="panelhead"><b>${t}</b></div>${b}</div>`}function clients(){return(S.d.customers||[]).filter(x=>x.account_type==='company')}function cust(id){return(S.d.customers||[]).find(x=>x.id===id)}function inv(id){return(S.d.invoices||[]).find(x=>x.id===id)}function modal(t,h){$('mtitle').textContent=t;$('mbody').innerHTML=h;$('modal').classList.remove('hidden')}function close(){$('modal').classList.add('hidden')}async function save(t,o){const {data,error}=await sb.from(t).insert(o).select();if(error)throw error;close();await load();return data||[]}function dash(){const i=S.d.invoices||[],p=S.d.payments||[],e=S.d.expenses||[],c=S.d.commissions||[];const sales=i.reduce((s,x)=>s+Number(x.amount_ttc||0),0),cash=p.filter(x=>/paye|paid|recu/i.test(x.status)).reduce((s,x)=>s+Number(x.amount||0),0),cost=e.reduce((s,x)=>s+Number(x.amount||0),0),com=c.reduce((s,x)=>s+Number(x.commission_amount||0),0);$('page').innerHTML=hero('Pilotage comptable','Chaîne simple : clients → factures → encaissements → dépenses → journal.',`<button class="btn ghost" onclick="CO.exportAll()">Export Excel</button>`)+`<div class="cards"><div class="card"><small>Clients</small><b>${clients().length}</b></div><div class="card"><small>Facturé</small><b>${money(sales)}</b></div><div class="card"><small>Encaissé</small><b>${money(cash)}</b></div><div class="card"><small>Charges + commissions</small><b>${money(cost+com)}</b></div></div>`}function customers(){const a=clients();$('page').innerHTML=hero('Clients','Base clients entreprises TalentCongo.',`<button class="btn green" onclick="CO.newClient()">Ajouter un client</button><button class="btn ghost" onclick="CO.excel('customers')">Excel</button>`)+panel('Clients',tbl(['Nom','E-mail','Téléphone','Statut','Créé le'],a.map(x=>`<tr><td><b>${esc(x.display_name)}</b></td><td>${esc(x.email)}</td><td>${esc(x.phone||'')}</td><td>${esc(x.status||'')}</td><td>${date(x.created_at)}</td></tr>`).join('')))}function invoices(){const a=S.d.invoices||[];$('page').innerHTML=hero('Factures','Création et PDF générique professionnel TalentCongo.',`<button class="btn green" onclick="CO.newInvoice()">Nouvelle facture</button><button class="btn ghost" onclick="CO.excel('invoices')">Excel</button>`)+panel('Factures',tbl(['N°','Client','Émission','Échéance','HT','Taxes','TTC','Statut','PDF'],a.map(x=>`<tr><td><b>${esc(x.invoice_number)}</b></td><td>${esc(cust(x.company_account_id)?.display_name||x.customer_name||'—')}</td><td>${date(x.issue_date)}</td><td>${date(x.due_date)}</td><td>${money(x.amount_ht)}</td><td>${money(x.tax_amount)}</td><td><b>${money(x.amount_ttc)}</b></td><td>${esc(x.status)}</td><td><button class="btn ghost" onclick="CO.invoicePdf('${x.id}')">PDF</button></td></tr>`).join('')))}function payments(){const a=S.d.payments||[];$('page').innerHTML=hero('Encaissements','Règlements clients.',`<button class="btn green" onclick="CO.newPayment()">Nouvel encaissement</button><button class="btn ghost" onclick="CO.excel('payments')">Excel</button>`)+panel('Encaissements',tbl(['Référence','Client','Montant','Échéance','Statut','Reçu le'],a.map(x=>`<tr><td>${esc(x.reference||'')}</td><td>${esc(cust(x.company_account_id)?.display_name||'—')}</td><td>${money(x.amount)}</td><td>${date(x.due_date)}</td><td>${esc(x.status)}</td><td>${date(x.paid_at)}</td></tr>`).join('')))}function commissions(){const a=S.d.commissions||[];$('page').innerHTML=hero('Commissions','Suivi des commissions.',`<button class="btn green" onclick="CO.newCommission()">Nouvelle commission</button><button class="btn ghost" onclick="CO.excel('commissions')">Excel</button>`)+panel('Commissions',tbl(['Libellé','Client','Base','Taux','Montant','Statut'],a.map(x=>`<tr><td>${esc(x.label)}</td><td>${esc(cust(x.company_account_id)?.display_name||'—')}</td><td>${money(x.basis_amount)}</td><td>${Number(x.rate||0)} %</td><td>${money(x.commission_amount)}</td><td>${esc(x.status)}</td></tr>`).join('')))}function expenses(){const a=S.d.expenses||[];$('page').innerHTML=hero('Dépenses','Charges et sorties de trésorerie.',`<button class="btn green" onclick="CO.newExpense()">Nouvelle dépense</button><button class="btn ghost" onclick="CO.excel('expenses')">Excel</button>`)+panel('Dépenses',tbl(['Libellé','Catégorie','Montant','Date','Moyen','Référence','Statut'],a.map(x=>`<tr><td>${esc(x.label)}</td><td>${esc(x.category||'')}</td><td>${money(x.amount)}</td><td>${date(x.expense_date)}</td><td>${esc(x.payment_method||'')}</td><td>${esc(x.reference||'')}</td><td>${esc(x.status)}</td></tr>`).join('')))}function journal(){const a=S.d.journal||[];$('page').innerHTML=hero('Journal comptable','Écritures structurées et exportables.',`<button class="btn green" onclick="CO.newEntry()">Nouvelle écriture</button><button class="btn ghost" onclick="CO.excel('journal')">Excel</button>`)+panel('Journal',tbl(['Date','Journal','Compte','Libellé','Pièce','Débit','Crédit','Statut'],a.map(x=>`<tr><td>${date(x.entry_date)}</td><td>${esc(x.journal)}</td><td>${esc(x.account_code)}</td><td>${esc(x.description)}</td><td>${esc(x.piece_number||'')}</td><td>${money(x.debit)}</td><td>${money(x.credit)}</td><td>${esc(x.status)}</td></tr>`).join('')))}function settings(){const s=(S.d.settings||[])[0]||{};$('page').innerHTML=hero('Paramètres facture','Informations génériques utilisées pour les PDF. À compléter avec les informations légales réelles.')+`<div class="panel"><div class="grid" style="padding:16px"><div><label>Raison sociale</label><input id="sl" value="${esc(s.legal_name||'TalentCongo')}"></div><div><label>RCCM</label><input id="sr" value="${esc(s.rccm||'')}"></div><div><label>NIU</label><input id="sn" value="${esc(s.niu||'')}"></div><div><label>Téléphone</label><input id="sp" value="${esc(s.phone_display||'')}"></div><div><label>E-mail</label><input id="se" value="${esc(s.email||'')}"></div><div><label>Ville</label><input id="sc" value="${esc(s.city||'Brazzaville')}"></div><div class="full"><label>Adresse</label><input id="sa" value="${esc(s.address||'')}"></div><div><label>Taux taxe par défaut (%)</label><input id="st" type="number" value="${Number(s.default_tax_rate||0)}"></div><div class="full"><label>Pied de facture</label><textarea id="sf">${esc(s.invoice_footer||'')}</textarea></div><div class="full"><button id="saveSettings" class="btn green">Enregistrer</button></div></div></div>`;$('saveSettings').onclick=async()=>{const o={legal_name:$('sl').value,rccm:$('sr').value,niu:$('sn').value,phone_display:$('sp').value,email:$('se').value,city:$('sc').value,address:$('sa').value,default_tax_rate:Number($('st').value)||0,invoice_footer:$('sf').value};const {error}=await sb.from('tc_settings').update(o).eq('id',1);if(error)alert(error.message);else{alert('Paramètres enregistrés.');load()}}}function exports(){const keys=['customers','invoices','payments','commissions','expenses','journal'];$('page').innerHTML=hero('Exports','Téléchargement Excel ou PDF des bases comptables.')+`<div class="panel"><div style="padding:16px" class="toolbar">${keys.map(k=>`<button class="btn ghost" onclick="CO.excel('${k}')">Excel ${defs[k][0]}</button><button class="btn ghost" onclick="CO.pdfTable('${k}')">PDF ${defs[k][0]}</button>`).join('')}</div></div>`}function render(){({dash,customers,invoices,payments,commissions,expenses,journal,settings,exports}[S.page]||dash)()}function opt(a,label='display_name'){return '<option value="">Sélectionner</option>'+a.map(x=>`<option value="${x.id}">${esc(x[label]||x.invoice_number||x.id)}</option>`).join('')}function newClient(){modal('Ajouter un client',`<div class="grid"><div><label>Nom entreprise</label><input id="cln"></div><div><label>E-mail</label><input id="cle" type="email"></div><div><label>Téléphone</label><input id="clp"></div><div><label>Statut</label><select id="cls"><option>pending</option><option>active</option></select></div><div class="full"><button id="clSave" class="btn green">Ajouter</button></div></div>`);$('clSave').onclick=async()=>{try{await save('tc_accounts',{account_type:'company',display_name:$('cln').value,email:$('cle').value,phone:$('clp').value,status:$('cls').value})}catch(e){if($('cls').value==='active')alert('Activation directe refusée par la règle de validation. Créez le client en statut pending puis validez-le via le workflow entreprise.');else alert(e.message)}}}function newInvoice(){const a=clients(),s=(S.d.settings||[])[0]||{};if(!a.length)return alert('Ajoutez d’abord un client.');modal('Nouvelle facture',`<div class="grid"><div><label>N° facture</label><input id="fn" placeholder="TC-2026-001"></div><div><label>Client</label><select id="fc">${opt(a)}</select></div><div><label>Date émission</label><input id="fi" type="date"></div><div><label>Échéance</label><input id="fd" type="date"></div><div class="full"><label>Prestation</label><input id="fo"></div><div><label>Quantité</label><input id="fq" type="number" value="1"></div><div><label>Prix unitaire HT</label><input id="fu" type="number" value="0"></div><div><label>Taxe (%)</label><input id="ft" type="number" value="${Number(s.default_tax_rate||0)}"></div><div><label>Statut</label><select id="fs"><option>draft</option><option>sent</option><option>paid</option></select></div><div class="full" id="calc"></div><div class="full"><button id="fSave" class="btn green">Créer la facture</button></div></div>`);const calc=()=>{const q=+($('fq').value||0),u=+($('fu').value||0),t=+($('ft').value||0),ht=q*u,tax=ht*t/100,ttc=ht+tax;$('calc').innerHTML=`<b>HT ${money(ht)} · Taxes ${money(tax)} · TTC ${money(ttc)}</b>`;return{q,u,t,ht,tax,ttc}};['fq','fu','ft'].forEach(i=>$(i).oninput=calc);calc();$('fSave').onclick=async()=>{try{const v=calc(),c=a.find(x=>x.id===$('fc').value);const rows=await save('tc_invoices',{invoice_number:$('fn').value,company_account_id:$('fc').value,customer_name:c?.display_name||'',issue_date:$('fi').value||new Date().toISOString().slice(0,10),due_date:$('fd').value||null,amount_ht:v.ht,tax_amount:v.tax,amount_ttc:v.ttc,currency:'XAF',status:$('fs').value});if(rows[0]){const {error}=await sb.from('tc_invoice_lines').insert({invoice_id:rows[0].id,description:$('fo').value,quantity:v.q,unit_price:v.u,tax_rate:v.t,line_ht:v.ht,line_tax:v.tax,line_ttc:v.ttc});if(error)console.warn(error.message)}await load()}catch(e){alert(e.message)}}}function newPayment(){const a=clients();modal('Nouvel encaissement',`<div class="grid"><div><label>Client</label><select id="pc">${opt(a)}</select></div><div><label>Référence</label><input id="pr"></div><div><label>Montant</label><input id="pa" type="number"></div><div><label>Échéance</label><input id="pd" type="date"></div><div><label>Statut</label><select id="ps"><option>a_payer</option><option>partiel</option><option>paye</option></select></div><div class="full"><button id="pSave" class="btn green">Enregistrer</button></div></div>`);$('pSave').onclick=()=>save('tc_payments',{company_account_id:$('pc').value,reference:$('pr').value,amount:Number($('pa').value)||0,due_date:$('pd').value||null,status:$('ps').value,paid_at:$('ps').value==='paye'?new Date().toISOString():null,currency:'XAF'}).catch(e=>alert(e.message))}function newCommission(){const a=clients();modal('Nouvelle commission',`<div class="grid"><div><label>Client</label><select id="cc">${opt(a)}</sele
