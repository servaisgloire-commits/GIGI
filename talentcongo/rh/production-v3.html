<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#006233"><title>TalentCongo ERP RH</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script><style>:root{--g:#006233;--y:#fbde00;--r:#d21034;--n:#071b2e;--bg:#f4f7f5;--line:#dfe8e3;--mut:#667085}*{box-sizing:border-box}body{margin:0;font:14px Inter,Arial,sans-serif;background:var(--bg);color:var(--n)}button,input,select,textarea{font:inherit}.flag{height:6px;background:linear-gradient(135deg,var(--g) 0 43%,var(--y) 43% 57%,var(--r) 57%)}.hidden{display:none!important}.auth{min-height:calc(100vh - 6px);display:grid;place-items:center;padding:20px;background:linear-gradient(120deg,#073d2ae8,#006233c7)}.authbox{width:min(470px,94vw);background:#fff;border-radius:20px;padding:28px;box-shadow:0 25px 70px #0004}.brand{display:flex;align-items:center;gap:12px}.brand img{width:180px;max-width:70%}h1,h2,h3{margin:0 0 10px}.muted{color:var(--mut)}label{display:block;font-size:11px;font-weight:800;margin:12px 0 5px}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd8d1;border-radius:9px;background:#fff}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer}.primary{background:var(--g);color:#fff}.dark{background:var(--n);color:#fff}.ghost{background:#fff;border:1px solid #cad7d1}.danger{background:#fff0f1;color:#a8172e}.wide{width:100%;margin-top:14px}.msg{margin-top:10px;font-size:12px}.bad{color:#b42318}.ok{color:#067647}.app{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 6px)}aside{background:#fff;border-right:1px solid var(--line);padding:16px;position:sticky;top:0;height:calc(100vh - 6px);overflow:auto}aside .brand{margin-bottom:18px}.grp{font-size:10px;color:#7b8c84;font-weight:900;text-transform:uppercase;margin:18px 8px 6px}.nav{width:100%;border:0;background:transparent;padding:10px;border-radius:9px;text-align:left;font-weight:750;cursor:pointer}.nav:hover,.nav.active{background:#eaf5ef;color:var(--g)}header{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:10px;position:sticky;top:0;z-index:5}.grow{flex:1}.content{padding:20px}.hero{background:linear-gradient(135deg,#06472d,var(--g));color:#fff;border-radius:16px;padding:20px;display:flex;justify-content:space-between;align-items:center;gap:12px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px #071b2e0d}.card{padding:16px}.card small{color:#667085;font-weight:800;text-transform:uppercase;font-size:10px}.card b{display:block;font-size:25px;margin-top:7px}.panel{margin-top:14px;overflow:hidden}.panelhead{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:10px 11px;border-bottom:1px solid #edf1ef;text-align:left;font-size:11px}th{background:#f6f8f7;text-transform:uppercase;color:#56665d}.actions{display:flex;gap:6px;flex-wrap:wrap}.pill{display:inline-block;border-radius:999px;padding:5px 8px;background:#eef4f1;font-weight:800}.modal{position:fixed;inset:0;background:#071b2e77;display:grid;place-items:center;padding:18px;z-index:20}.modalbox{width:min(760px,96vw);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.menu{display:none}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.app{display:block}aside{position:fixed;left:-290px;width:270px;z-index:15;transition:.2s}aside.open{left:0}.menu{display:inline-block}.cards,.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="flag"></div><section id="auth" class="auth"><div class="authbox"><div class="brand"><img src="https://cdn.jsdelivr.net/gh/servaisgloire-commits/GIGI@main/talentcongo/assets/logo.svg" alt="TalentCongo"></div><div id="loginBox"><h2 style="margin-top:24px">Connexion ERP RH</h2><p class="muted">Administration RH, paie, contrats et exports.</p><label>E-mail</label><input id="email" type="email" autocomplete="username"><label>Mot de passe</label><input id="password" type="password" autocomplete="current-password"><button id="login" class="btn primary wide">Se connecter</button><button id="showSetup" class="btn ghost wide">Créer le premier administrateur</button><div id="notice" class="msg"></div></div><div id="setupBox" class="hidden"><h2 style="margin-top:24px">Premier administrateur</h2><p class="muted">Compte commun aux ERP RH et Comptabilité.</p><label>Nom</label><input id="sname" value="Administrateur TalentCongo"><label>E-mail</label><input id="semail" type="email"><label>Mot de passe</label><input id="spass" type="password" minlength="10"><button id="createAdmin" class="btn primary wide">Créer le compte principal</button><button id="backLogin" class="btn ghost wide">Retour connexion</button><div id="snotice" class="msg"></div></div></div></section><section id="app" class="app hidden"><aside><div class="brand"><img src="https://cdn.jsdelivr.net/gh/servaisgloire-commits/GIGI@main/talentcongo/assets/logo.svg" alt="TalentCongo"></div><div id="nav"></div><button id="logout" class="nav danger">Déconnexion</button></aside><main><header><button id="menu" class="btn ghost menu">☰</button><div><b id="title">Tableau de bord RH</b><div class="muted" style="font-size:11px">Supabase FindZone · Production</div></div><div class="grow"></div><button id="refresh" class="btn ghost">Actualiser</button></header><div class="content"><section id="page"></section></div></main></section><div id="modal" class="modal hidden"><div class="modalbox"><div class="toolbar"><h3 id="mtitle" class="grow"></h3><button id="mclose" class="btn ghost">Fermer</button></div><div id="mbody"></div></div></div><script>const BASE='https://ioffjwxfxrqvxttbjeok.supabase.co',KEY='sb_publishable_52lG_rrc0j4MG6a0hrCWcQ_oVdqNVvS';const sb=supabase.createClient(BASE,KEY,{auth:{persistSession:true,autoRefreshToken:true}}),$=x=>document.getElementById(x);const defs={dash:['Tableau de bord','Pilotage'],candidates:['Candidatures','Recrutement','tc_candidates'],staff:['Personnel','Recrutement','tc_accounts'],missions:['Missions','Exploitation','tc_missions'],contracts:['Contrats','Exploitation','tc_contracts'],timesheets:['Temps & présences','Exploitation','tc_timesheets'],payroll:['Paie','Paie','tc_salaries'],paysettings:['Paramètres paie','Paie'],leave:['Congés & absences','Organisation','tc_leave_requests'],documents:['Documents','Organisation','tc_documents'],exports:['Exports PDF / Excel','Contrôle']};const S={d:{},page:'dash',profile:null};const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const money=v=>Number(v||0).toLocaleString('fr-FR')+' XAF',date=v=>v?new Date(v).toLocaleDateString('fr-FR'):'—';function msg(id,t,b=false){$(id).className='msg '+(b?'bad':'ok');$(id).textContent=t}async function firstAdminAvailable(){const {data,error}=await sb.rpc('tc_admin_setup_available');if(error)throw error;return !!data}async function login(){const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return msg('notice','Connexion refusée : '+error.message,true);enter()}async function createAdmin(){try{if(!(await firstAdminAvailable()))throw Error('Un administrateur existe déjà.');const email=$('semail').value.trim(),password=$('spass').value,name=$('sname').value.trim();if(!email.includes('@')||password.length<10)throw Error('E-mail valide et mot de passe de 10 caractères minimum.');let ok=false;try{const r=await fetch(BASE+'/functions/v1/talentcongo-first-admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password,display_name:name})});if(r.ok)ok=true}catch(e){}if(!ok){const {data,error}=await sb.auth.signUp({email,password});if(error)throw error;if(!data.session)throw Error('Compte créé. Confirmez l’e-mail puis reconnectez-vous pour terminer l’activation.');const {error:claim}=await sb.rpc('tc_claim_first_admin',{p_display_name:name});if(claim)throw claim}msg('snotice','Administrateur créé. Vous pouvez vous connecter.');setTimeout(()=>{$('setupBox').classList.add('hidden');$('loginBox').classList.remove('hidden');$('email').value=email},500)}catch(e){msg('snotice',e.message||String(e),true)}}async function enter(){const {data:{session}}=await sb.auth.getSession();if(!session)return;const {data:p,error}=await sb.from('tc_admin_profiles').select('*').eq('user_id',session.user.id).maybeSingle();if(error||!p||!p.is_active||!['super_admin','admin','rh'].includes(p.role))return msg('notice','Accès RH non autorisé.',true);S.profile=p;$('auth').classList.add('hidden');$('app').classList.remove('hidden');await load()}function nav(){let g='';$('nav').innerHTML=Object.entries(defs).map(([k,d])=>{let h='';if(d[1]!==g){g=d[1];h=`<div class="grp">${g}</div>`}return h+`<button class="nav" data-p="${k}">${d[0]}</button>`}).join('');document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>go(b.dataset.p))}async function q(t,ord='created_at'){const {data,error}=await sb.from(t).select('*').order(ord,{ascending:false});if(error)throw error;return data||[]}async function load(){try{const map={candidates:'tc_candidates',staff:'tc_accounts',missions:'tc_missions',contracts:'tc_contracts',timesheets:'tc_timesheets',payroll:'tc_salaries',leave:'tc_leave_requests',documents:'tc_documents'};for(const [k,t] of Object.entries(map)){try{S.d[k]=await q(t)}catch(e){S.d[k]=[]}}render()}catch(e){alert(e.message)}}function go(p){S.page=p;$('title').textContent=defs[p][0];document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('active',b.dataset.p===p));render();document.querySelector('aside').classList.remove('open')}function hero(t,s,a=''){return `<div class="hero"><div><h2>${t}</h2><div>${s}</div></div><div class="toolbar">${a}</div></div>`}function tbl(cols,rows){return `<div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${cols.length}" class="muted">Aucune donnée.</td></tr>`}</tbody></table></div>`}function panel(t,b){return `<div class="panel"><div class="panelhead"><b>${t}</b></div>${b}</div>`}function accounts(){return(S.d.staff||[]).filter(x=>x.account_type==='candidate')}function acc(id){return(S.d.staff||[]).find(x=>x.id===id)}function mission(id){return(S.d.missions||[]).find(x=>x.id===id)}function modal(t,h){$('mtitle').textContent=t;$('mbody').innerHTML=h;$('modal').classList.remove('hidden')}function close(){$('modal').classList.add('hidden')}async function save(t,o){const {error}=await sb.from(t).insert(o);if(error)throw error;close();await load()}function dash(){const c=S.d.candidates||[],a=accounts(),m=S.d.missions||[],p=S.d.payroll||[];$('page').innerHTML=hero('Pilotage RH','Vue simple inspirée des ERP RH : recrutement → mission → temps → paie → documents.',`<button class="btn ghost" onclick="RH.exportAll()">Export Excel</button>`)+`<div class="cards"><div class="card"><small>Candidatures</small><b>${c.length}</b></div><div class="card"><small>Personnel</small><b>${a.length}</b></div><div class="card"><small>Missions</small><b>${m.length}</b></div><div class="card"><small>Net paie suivi</small><b>${money(p.reduce((s,x)=>s+Number(x.net_salary||0),0))}</b></div></div>`}function candidates(){const a=S.d.candidates||[];$('page').innerHTML=hero('Candidatures','Candidatures reçues depuis le site.',`<button class="btn ghost" onclick="RH.excel('candidates')">Excel</button><button class="btn ghost" onclick="RH.pdfTable('candidates')">PDF</button>`)+panel('Dossiers',tbl(['Nom','E-mail','Téléphone','Métier','Statut'],a.map(x=>`<tr><td><b>${esc(x.first_name)} ${esc(x.last_name)}</b></td><td>${esc(x.email)}</td><td>${esc(x.phone)}</td><td>${esc(x.target_role)}</td><td><span class="pill">${esc(x.status)}</span></td></tr>`).join('')))}function staff(){const a=accounts();$('page').innerHTML=hero('Personnel','Comptes candidats/salariés.',`<button class="btn ghost" onclick="RH.excel('staff')">Excel</button>`)+panel('Personnel',tbl(['Nom','E-mail','Téléphone','Statut'],a.map(x=>`<tr><td><b>${esc(x.display_name)}</b></td><td>${esc(x.email)}</td><td>${esc(x.phone||'')}</td><td>${esc(x.status)}</td></tr>`).join('')))}function missions(){const a=S.d.missions||[];$('page').innerHTML=hero('Missions','Affectations opérationnelles.',`<button class="btn primary" onclick="RH.newMission()">Nouvelle mission</button><button class="btn ghost" onclick="RH.excel('missions')">Excel</button>`)+panel('Missions',tbl(['Salarié','Mission','Lieu','Début','Fin','Taux','Statut'],a.map(x=>`<tr><td>${esc(acc(x.candidate_account_id)?.display_name||'—')}</td><td><b>${esc(x.title)}</b></td><td>${esc(x.location||'')}</td><td>${date(x.start_date)}</td><td>${date(x.end_date)}</td><td>${money(x.rate)}</td><td>${esc(x.status)}</td></tr>`).join('')))}function contracts(){const a=S.d.contracts||[];$('page').innerHTML=hero('Contrats','Contrats liés aux salariés et missions.',`<button class="btn primary" onclick="RH.newContract()">Nouveau contrat</button><button class="btn ghost" onclick="RH.excel('contracts')">Excel</button>`)+panel('Contrats',tbl(['N°','Salarié','Poste','Type','Période','Salaire','Statut'],a.map(x=>`<tr><td>${esc(x.contract_number)}</td><td>${esc(acc(x.candidate_account_id)?.display_name||'—')}</td><td>${esc(x.job_title)}</td><td>${esc(x.contract_type)}</td><td>${date(x.start_date)} → ${date(x.end_date)}</td><td>${money(x.base_salary)}</td><td>${esc(x.status)}</td></tr>`).join('')))}function timesheets(){const a=S.d.timesheets||[];$('page').innerHTML=hero('Temps & présences','Feuilles de temps avant paie.',`<button class="btn primary" onclick="RH.newTs()">Nouvelle feuille</button><button class="btn ghost" onclick="RH.excel('timesheets')">Excel</button>`)+panel('Feuilles',tbl(['Salarié','Mission','Période','Heures','Sup.','Absence','Statut'],a.map(x=>`<tr><td>${esc(acc(x.candidate_account_id)?.display_name||'—')}</td><td>${esc(mission(x.mission_id)?.title||'—')}</td><td>${date(x.period_start)} → ${date(x.period_end)}</td><td>${x.regular_hours||0}</td><td>${x.overtime_hours||0}</td><td>${x.absence_hours||0}</td><td>${esc(x.status)}</td></tr>`).join('')))}function cfg(){return Object.assign({overtime:1.5,employeeRate:0,employerRate:0,taxRate:0,allowance:0},JSON.parse(localStorage.getItem('tc_payroll_cfg')||'{}'))}function payroll(){const a=S.d.payroll||[];$('page').innerHTML=hero('Paie','Calcul paramétrable et génération de bulletin PDF.',`<button class="btn primary" onclick="RH.newPay()">Nouvelle paie</button><button class="btn ghost" onclick="RH.excel('payroll')">Excel</button>`)+panel('Paies',tbl(['Salarié','Période','Brut','Retenues','Net','Statut','Bulletin'],a.map(x=>`<tr><td>${esc(acc(x.candidate_account_id)?.display_name||'—')}</td><td>${date(x.period_start)} → ${date(x.period_end)}</td><td>${money(x.gross_salary)}</td><td>${money(x.deductions)}</td><td><b>${money(x.net_salary)}</b></td><td>${esc(x.payment_status)}</td><td><button class="btn ghost" onclick="RH.payslip('${x.id}')">PDF</button></td></tr>`).join('')))}function paysettings(){const c=cfg();$('page').innerHTML=hero('Paramètres métier paie','Taux configurables. À faire valider selon les règles sociales/fiscales applicables au Congo.')+`<div class="panel"><div class="grid" style="padding:16px"><div><label>Majoration heures sup. (x)</label><input id="po" type="number" step="0.1" value="${c.overtime}"></div><div><label>Cotisations salarié (%)</label><input id="pe" type="number" step="0.01" value="${c.employeeRate}"></div><div><label>Cotisations employeur (%)</label><input id="pem" type="number" step="0.01" value="${c.employerRate}"></div><div><label>Retenue fiscale (%)</label><input id="pt" type="number" step="0.01" value="${c.taxRate}"></div><div><label>Indemnité fixe par paie</label><input id="pa" type="number" value="${c.allowance}"></div><div class="full"><button id="saveCfg" class="btn primary">Enregistrer les paramètres</button></div></div></div>`;$('saveCfg').onclick=()=>{localStorage.setItem('tc_payroll_cfg',JSON.stringify({overtime:Number($('po').value)||1,employeeRate:Number($('pe').value)||0,employerRate:Number($('pem').value)||0,taxRate:Number($('pt').value)||0,allowance:Number($('pa').value)||0}));alert('Paramètres enregistrés sur ce poste.')}}function leave(){const a=S.d.leave||[];$('page').innerHTML=hero('Congés & absences','Suivi des demandes.',`<button class="btn ghost" onclick="RH.excel('leave')">Excel</button>`)+panel('Demandes',tbl(['Salarié','Type','Début','Fin','Jours','Statut'],a.map(x=>`<tr><td>${esc(acc(x.candidate_account_id)?.display_name||'—')}</td><td>${esc(x.leave_type||'')}</td><td>${date(x.start_date)}</td><td>${date(x.end_date)}</td><td>${x.days??''}</td><td>${esc(x.status)}</td></tr>`).join('')))}function documents(){const a=S.d.documents||[];$('page').innerHTML=hero('Documents','Références documentaires RH.',`<button class="btn ghost" onclick="RH.excel('documents')">Excel</button>`)+panel('Documents',tbl(['Nom','Type','Créé le'],a.map(x=>`<tr><td>${esc(x.name||x.file_name||'Document')}</td><td>${esc(x.document_type||x.type||'')}</td><td>${date(x.created_at)}</td></tr>`).join('')))}function exports(){const keys=['candidates','staff','missions','contracts','timesheets','payroll','leave','documents'];$('page').innerHTML=hero('Exports','Télécharger les données RH sans modifier la base.')+`<div class="panel"><div style="padding:16px" class="toolbar">${keys.map(k=>`<button class="btn ghost" onclick="RH.excel('${k}')">Excel ${defs[k][0]}</button><button class="btn ghost" onclick="RH.pdfTable('${k}')">PDF ${defs[k][0]}</button>`).join('')}</div></div>`}function render(){({dash,candidates,staff,missions,contracts,timesheets,payroll,paysettings,leave,documents,exports}[S.page]||dash)()}function opt(a,label='display_name'){return '<option value="">Sélectionner</option>'+a.map(x=>`<option value="${x.id}">${esc(x[label]||x.title||x.id)}</option>`).join('')}function newMission(){const a=accounts();modal('Nouvelle mission',`<div class="grid"><div><label>Salarié</label><select id="mc">${opt(a)}</select></div><div><label>Mission</label><input id="mt"></div><div><label>Lieu</label><input id="ml" value="Brazzaville"></div><div><label>Taux</label><input id="mr" type="number"></div><div><label>Début</label><input id="ms" type="date"></div><div><label>Fin</label><input id="me" type="date"></div><div><label>Statut</label><select id="mst"><option>planifiee</option><option>en_cours</option><option>terminee</option></select></div><div class="full"><button id="mSave" class="btn primary">Créer</button></div></div>`);$('mSave').onclick=()=>save('tc_missions',{candidate_account_id:$('mc').value,title:$('mt').value,location:$('ml').value,rate:Number($('mr').value)||0,start_date:$('ms').value||null,end_date:$('me').value||null,status:$('mst').value,currency:'XAF'}).catch(e=>alert(e.message))}function newContract(){const a=accounts();modal('Nouveau contrat',`<div class="grid"><div><label>N° contrat</label><input id="cn"></div><div><label>Salarié</label><select id="cc">${opt(a)}</select></div><div><label>Type</label><select id="ct"><option>Interim</option><option>CDD</option><option>CDI</option><option>Prestation</option></select></div><div><label>Poste</label><input id="cj"></div><div><label>Début</label><input id="cs" type="date"></div><div><label>Fin</label><input id="ce" type="date"></div><div><label>Salaire de base</label><input id="cb" type="number"></div><div class="full"><button id="cSave" class="btn primary">Créer</button></div></div>`);$('cSave').onclick=()=>save('tc_contracts',{contract_number:$('cn').value,candidate_account_id:$('cc').value,contract_type:$('ct').value,job_title:$('cj').value,start_date:$('cs').value,end_date:$('ce').value||null,base_salary:Number($('cb').value)||0,status:'Brouillon',currency:'XAF'}).catch(e=>alert(e.message))}function newTs(){const a=accounts(),m=S.d.missions||[];modal('Nouvelle feuille de temps',`<div class="grid"><div><label>Salarié</label><select id="tc">${opt(a)}</select></div><div><label>Mission</label><select id="tm">${opt(m,'title')}</select></div><div><label>Début</label><input id="ts" type="date"></div><div><label>Fin</label><input id="te" type="date"></div><div><label>Heures normales</label><input id="th" type="number" value="0"></div><div><label>Heures sup.</label><input id="to" type="number" value="0"></div><div><label>Absence</label><input id="ta" type="number" value="0"></div><div class="full"><button id="tSave" class="btn primary">Créer</button></div></div>`);$('tSave').onclick=()=>save('tc_timesheets',{candidate_account_id:$('tc').value,mission_id:$('tm').value,period_start:$('ts').value,period_end:$('te').value,regular_hours:Number($('th').value)||0,overtime_hours:Number($('to').value)||0,absence_hours:Number($('ta').value)||0,status:'Soumis',submitted_at:new Date().toISOString()}).catch(e=>alert(e.message))}function newPay(){const a=accounts(),m=S.d.missions||[],c=cfg();modal('Nouvelle paie',`<div class="grid"><div><label>Salarié</label><select id="pc">${opt(a)}</select></div><div><label>Mission</label><select id="pm">${opt(m,'title')}</select></div><div><label>Début période</label><input id="ps" type="date"></div><div><label>Fin période</label><input id="pf" type="date"></div><div><label>Heures normales</labe
