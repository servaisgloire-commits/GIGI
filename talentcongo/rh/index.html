ve_type||'—')}</td><td>${date(x.start_date)}</td><td>${date(x.end_date)}</td><td>${x.days??'—'}</td><td>${status(x.status)}</td><td>${esc(x.reason||'')}</td></tr>`).join('')))}function payroll(){const a=state.d.payroll||[];$('page').innerHTML=hero('Paie','Heures, taux, primes, retenues, brut, net et statut de paiement.',`<button class="btn primary" onclick="RH.newPay()">Nouvelle paie</button>`)+panel('Paies',table(['Salarié','Mission','Période','Heures','Taux','Primes','Retenues','Brut','Net','Statut'],a.map(x=>`<tr><td><b>${esc(acc(x.candidate_account_id)?.display_name||'—')}</b></td><td>${esc(mis(x.mission_id)?.title||'—')}</td><td>${date(x.period_start)} → ${date(x.period_end)}</td><td>${Number(x.hours_worked||0)}</td><td>${money(x.hourly_rate)}</td><td>${money(x.bonuses)}</td><td>${money(x.deductions)}</td><td>${money(x.gross_salary)}</td><td><b>${money(x.net_salary)}</b></td><td>${status(x.payment_status)}</td></tr>`).join('')))}function tasks(){const a=state.d.tasks||[];$('page').innerHTML=hero('Tâches RH','Actions de suivi et échéances internes.')+panel('Tâches',table(['Titre','Catégorie','Responsable','Échéance','Priorité','Statut'],a.map(x=>`<tr><td><b>${esc(x.title)}</b></td><td>${esc(x.category||'')}</td><td>${esc(x.assigned_to||'')}</td><td>${date(x.due_date)}</td><td>${esc(x.priority)}</td><td>${status(x.status)}</td></tr>`).join('')))}function approvals(){const a=state.d.approvals||[];$('page').innerHTML=hero('Validations','Demandes nécessitant une validation interne.')+panel('Validations',table(['Type','Objet','Statut','Créé le'],a.map(x=>`<tr><td>${esc(x.approval_type||x.entity_type||'Validation')}</td><td>${esc(x.entity_id||x.reference_id||'—')}</td><td>${status(x.status)}</td><td>${date(x.created_at)}</td></tr>`).join('')))}function documents(){const a=state.d.documents||[];$('page').innerHTML=hero('Documents','Documents RH stockés et référencés dans Supabase.')+panel('Documents',table(['Nom','Type','Salarié','Mission','Créé le'],a.map(x=>`<tr><td><b>${esc(x.name||x.file_name||'Document')}</b></td><td>${esc(x.document_type||x.type||'—')}</td><td>${esc(acc(x.candidate_account_id)?.display_name||'—')}</td><td>${esc(mis(x.mission_id)?.title||'—')}</td><td>${date(x.created_at)}</td></tr>`).join('')))}function audit(){const a=(state.d.audit||[]).filter(x=>['tc_candidates','tc_accounts','tc_missions','tc_contracts','tc_timesheets','tc_salaries','tc_leave_requests','tc_documents'].includes(x.table_name));$('page').innerHTML=hero('Journal RH','Traçabilité des modifications RH.')+panel('Historique',table(['Date','Table','Opération','ID'],a.map(x=>`<tr><td>${date(x.changed_at)}</td><td>${esc(x.table_name)}</td><td>${status(x.operation)}</td><td>${esc(x.record_id)}</td></tr>`).join('')))}function modal(t,h){$('mtitle').textContent=t;$('mbody').innerHTML=h;$('modal').classList.remove('hidden')}function close(){$('modal').classList.add('hidden')}async function save(t,o,m=null){let q=m?sb.from(t).update(o):sb.from(t).insert(o);if(m)Object.entries(m).forEach(([k,v])=>q=q.eq(k,v));const {error}=await q;if(error)throw Error(error.message);close();toast('Enregistré avec succès dans Supabase.');await load()}async function call(path,body){const s=await session(),r=await fetch(URL+'/functions/v1/talentcongo-admin-actions'+path,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+s.access_token},body:JSON.stringify(body)}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Erreur serveur');return d}function cstat(id){modal('Statut candidat',`<label>Statut</label><select id="fstat"><option>Nouveau</option><option>À étudier</option><option>Contacté</option><option>Retenu</option><option>Archivé</option></select><button id="fsave" class="btn primary wide">Enregistrer</button>`);$('fsave').onclick=()=>save('tc_candidates',{status:$('fstat').value},{id}).catch(e=>toast(e.message,true))}async function invite(id){try{const c=(state.d.candidates||[]).find(x=>x.id===id);if(!c||!['Retenu','Validé','Validée'].includes(c.status))throw Error('Le candidat doit être retenu avant la création de son espace.');await call('/invite-candidate',{id});toast('Espace salarié créé avec succès.');await load()}catch(e){toast(e.message,true)}}function newMission(){const a=avail();if(!a.length){toast('Aucun salarié disponible.',true);return}modal('Nouvelle mission',`<div class="grid"><div><label>Salarié</label><select id="fc">${opt(a)}</select></div><div><label>Mission</label><input id="ft"></div><div><label>Lieu</label><input id="fl" value="Brazzaville"></div><div><label>Taux</label><input id="fr" type="number"></div><div><label>Début</label><input id="fs" type="date"></div><div><label>Fin</label><input id="fe" type="date"></div><div><label>Statut</label><select id="fst"><option>planifiee</option><option>en_cours</option><option>terminee</option></select></div><div class="full"><button id="fsave" class="btn primary">Créer</button></div></div>`);$('fsave').onclick=()=>save('tc_missions',{candidate_account_id:$('fc').value,title:$('ft').value,location:$('fl').value,rate:Number($('fr').value)||0,start_date:$('fs').value||null,end_date:$('fe').value||null,status:$('fst').value,currency:'XAF'}).catch(e=>toast(e.message,true))}function newContract(){const a=accounts();if(!a.length){toast('Aucun salarié actif.',true);return}modal('Nouveau contrat',`<div class="grid"><div><label>N° contrat</label><input id="fn"></div><div><label>Salarié</label><select id="fc">${opt(a)}</select></div><div><label>Mission</label><select id="fm">${opt(state.d.missions||[],'title')}</select></div><div><label>Type</label><select id="fty"><option>Interim</option><option>CDD</option><option>CDI</option><option>Prestation</option></select></div><div><label>Poste</label><input id="fj"></div><div><label>Début</label><input id="fs" type="date"></div><div><label>Fin</label><input id="fe" type="date"></div><div><label>Salaire de base</label><input id="fb" type="number"></div><div class="full"><button id="fsave" class="btn primary">Créer</button></div></div>`);$('fsave').onclick=()=>save('tc_contracts',{contract_number:$('fn').value,candidate_account_id:$('fc').value,mission_id:$('fm').value||null,contract_type:$('fty').value,job_title:$('fj').value,start_date:$('fs').value,end_date:$('fe').value||null,base_salary:Number($('fb').value)||0,status:'Brouillon',currency:'XAF'}).catch(e=>toast(e.message,true))}function newTs(){const a=accounts(),m=(state.d.missions||[]).filter(x=>x.status==='en_cours');if(!a.length||!m.length){toast('Il faut un salarié actif et une mission en cours.',true);return}modal('Nouvelle feuille de temps',`<div class="grid"><div><label>Salarié</label><select id="fc">${opt(a)}</select></div><div><label>Mission</label><select id="fm">${opt(m,'title')}</select></div><div><label>Début</label><input id="fs" type="date"></div><div><label>Fin</label><input id="fe" type="date"></div><div><label>Heures normales</label><input id="fh" type="number" value="0"></div><div><label>Heures sup.</label><input id="fo" type="number" value="0"></div><div><label>Absence</label><input id="fa" type="number" value="0"></div><div class="full"><button id="fsave" class="btn primary">Créer</button></div></div>`);$('fsave').onclick=()=>save('tc_timesheets',{candidate_account_id:$('fc').value,mission_id:$('fm').value,period_start:$('fs').value,period_end:$('fe').value,regular_hours:Number($('fh').value)||0,overtime_hours:Number($('fo').value)||0,absence_hours:Number($('fa').value)||0,status:'Soumis',submitted_at:new Date().toISOString()}).catch(e=>toast(e.message,true))}function approveTs(id){save('tc_timesheets',{status:'Validé',approved_at:new Date().toISOString(),approved_by:state.profile.user_id},{id}).catch(e=>toast(e.message,true))}function newPay(){const a=accounts();if(!a.length){toast('Aucun salarié actif.',true);return}modal('Nouvelle paie',`<div class="grid"><div><label>Salarié</label><select id="fc">${opt(a)}</select></div><div><label>Mission</label><select id="fm">${opt(state.d.missions||[],'title')}</select></div><div><label>Début</label><input id="fs" type="date"></div><div><label>Fin</label><input id="fe" type="date"></div><div><label>Heures</label><input id="fh" type="number" value="0"></div><div><label>Taux horaire</label><input id="fr" type="number" value="0"></div><div><label>Primes</label><input id="fb" type="number" value="0"></div><div><label>Retenues</label><input id="fd" type="number" value="0"></div><div class="full" id="calc"></div><div class="full"><button id="fsave" class="btn primary">Créer la paie</button></div></div>`);const calc=()=>{const h=Number($('fh').value)||0,r=Number($('fr').value)||0,b=Number($('fb').value)||0,d=Number($('fd').value)||0,g=h*r+b,n=Math.max(0,g-d);$('calc').textContent=`Brut ${money(g)} · Net ${money(n)}`;return{g,n}};['fh','fr','fb','fd'].forEach(i=>$(i).oninput=calc);calc();$('fsave').onclick=async()=>{const {g,n}=calc();save('tc_salaries',{candidate_account_id:$('fc').value,mission_id:$('fm').value||null,period_start:$('fs').value,period_end:$('fe').value,hours_worked:Number($('fh').value)||0,hourly_rate:Number($('fr').value)||0,bonuses:Number($('fb').value)||0,deductions:Number($('fd').value)||0,gross_salary:g,net_salary:n,currency:'XAF',payment_status:'a_payer'}).catch(e=>toast(e.message,true))}}function live(){sb.channel('rh-live').on('postgres_changes',{event:'*',schema:'public'},()=>{clearTimeout(live.t);live.t=setTimeout(load,400)}).subscribe()}window.RH={cstat,invite,newMission,newContract,newTs,approveTs,newPay};$('login').onclick=login;$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};$('refresh').onclick=load;$('menu').onclick=()=>document.querySelector('.side').classList.toggle('open');$('mclose').onclick=close;$('modal').onclick=e=>{if(e.target===$('modal'))close()};nav();go('dash');session().then(s=>s&&enter());
</script></body></html>
