<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#006233"><title>TalentCongo RH</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23006233'/%3E%3Cpath d='M13 18h38v8H36v25h-9V26H13z' fill='white'/%3E%3Cpath d='M40 15l9 8-9 8' fill='none' stroke='%23fbde00' stroke-width='5'/%3E%3Cpath d='M48 39l-9 8 9 8' fill='none' stroke='%23d21034' stroke-width='5'/%3E%3C/svg%3E"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:#f4f7f5;color:#071b2e}.flag{height:6px;background:linear-gradient(135deg,#006233 0 43%,#fbde00 43% 57%,#d21034 57%)}.screen{min-height:calc(100vh - 6px);display:grid;place-items:center;padding:22px;background:linear-gradient(135deg,#eef8f2,#f7f9f8)}.card{width:min(490px,94vw);background:#fff;border:1px solid #dfe8e3;border-radius:22px;padding:30px;box-shadow:0 22px 70px #071b2e18}.brand{display:flex;align-items:center;gap:12px;font-size:24px;font-weight:950}.logo{width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,#006233 0 56%,#fbde00 56% 72%,#d21034 72%);display:grid;place-items:center;color:#fff;font-weight:950}.brand small{display:block;font-size:10px;color:#667085}.muted{color:#667085}.hidden{display:none!important}label{display:block;font-size:11px;font-weight:850;margin:13px 0 6px}input{width:100%;padding:12px;border:1px solid #cbd8d1;border-radius:10px;font:inherit}.btn{width:100%;margin-top:16px;padding:12px;border:0;border-radius:10px;background:#006233;color:#fff;font-weight:900;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.msg{margin-top:12px;font-size:12px;white-space:pre-wrap}.bad{color:#b42318}.ok{color:#067647}.loader{width:34px;height:34px;border:4px solid #dce8e1;border-top-color:#006233;border-radius:50%;margin:18px auto;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}</style></head><body><div class="flag"></div><main id="boot" class="screen"><section class="card"><div class="brand"><span class="logo">T</span><span>TalentCongo<small>ERP RESSOURCES HUMAINES · PRÉDEV</small></span></div><div id="checking"><h2>Connexion au système</h2><p class="muted">Vérification de Supabase FindZone et de l’administrateur principal.</p><div class="loader"></div><div id="bootmsg" class="msg"></div></div><div id="setup" class="hidden"><h2>Créer le premier administrateur</h2><p class="muted">Ce compte <b>super_admin</b> sera commun à l’ERP RH et à l’ERP Comptabilité.</p><label>Nom affiché</label><input id="name" value="Administrateur TalentCongo" autocomplete="name"><label>E-mail</label><input id="email" type="email" autocomplete="username"><label>Mot de passe</label><input id="password" type="password" minlength="10" autocomplete="new-password"><button id="create" class="btn">Créer l’administrateur principal</button><div id="msg" class="msg"></div></div></section></main><script>const URL='https://ioffjwxfxrqvxttbjeok.supabase.co',KEY='sb_publishable_52lG_rrc0j4MG6a0hrCWcQ_oVdqNVvS';const $=id=>document.getElementById(id);async function sdk(){if(window.supabase)return true;return new Promise(r=>{const s=document.createElement('script');s.src='https://unpkg.com/@supabase/supabase-js@2';s.onload=()=>r(!!window.supabase);s.onerror=()=>r(false);document.head.appendChild(s)})}async function loadERP(){const urls=['https://cdn.jsdelivr.net/gh/servaisgloire-commits/GIGI@61423bfc9e688138eb32f7002ad7a27dada0685b/talentcongo/rh/index.html','https://raw.githubusercontent.com/servaisgloire-commits/GIGI/61423bfc9e688138eb32f7002ad7a27dada0685b/talentcongo/rh/index.html'];let html='';for(const u of urls){try{const r=await fetch(u,{cache:'no-store'});if(r.ok){html=await r.text();break}}catch{}}if(!html)throw Error('Impossible de charger le module RH.');const blob=new Blob([html],{type:'text/html'}),src=URL.createObjectURL(blob);document.body.innerHTML='<iframe id="erp" title="ERP RH TalentCongo"></iframe>';document.getElementById('erp').src=src}async function init(){try{if(!await sdk())throw Error('Bibliothèque de connexion indisponible.');const sb=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true}});window.tcSB=sb;const {data,error}=await sb.rpc('tc_admin_setup_available');if(error)throw error;if(data){$('checking').classList.add('hidden');$('setup').classList.remove('hidden')}else await loadERP()}catch(e){$('bootmsg').className='msg bad';$('bootmsg').textContent='Erreur : '+(e.message||e)}}$('create').onclick=async()=>{const b=$('create'),m=$('msg');b.disabled=true;m.className='msg';m.textContent='Création en cours…';try{const email=$('email').value.trim(),password=$('password').value,name=$('name').value.trim()||'Administrateur TalentCongo';if(!email.includes('@'))throw Error('Saisissez un e-mail valide.');if(password.length<10)throw Error('Le mot de passe doit contenir au moins 10 caractères.');const r=await fetch(URL+'/functions/v1/talentcongo-first-admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password,display_name:name})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||('Erreur HTTP '+r.status));m.className='msg ok';m.textContent='Administrateur créé. Ouverture de l’ERP RH…';setTimeout(()=>location.reload(),700)}catch(e){m.className='msg bad';m.textContent=e.message||String(e);b.disabled=false}};init();</script></body></html>
