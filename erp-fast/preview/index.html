<style>
:root{--nav:#092862;--nav2:#0e3c90;--blue:#0b69ff;--blue2:#eaf2ff;--cyan:#22d7ff;--ink:#101828;--muted:#667085;--line:#e4e7ec;--bg:#f5f7fb;--card:#fff;--ok:#067647;--warn:#b54708;--bad:#b42318;--shadow:0 10px 30px #1018280c}*{box-sizing:border-box}body{margin:0;font:14px/1.45 Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.hidden{display:none!important}.shell{min-height:100vh;display:grid;grid-template-columns:275px 1fr}.sidebar{background:linear-gradient(180deg,#06255c 0%,#0e4094 100%);color:#fff;position:sticky;top:0;height:100vh;padding:18px 14px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:12px;padding:2px 6px 18px}.brand-logo{width:68px;height:54px;display:block}.brand-text strong{display:block;font-size:27px;line-height:1;font-weight:900;letter-spacing:.2px}.brand-text small{display:block;margin-top:7px;font-weight:800;letter-spacing:1.3px;color:#b8d1ff}.nav{display:grid;gap:7px;margin-top:12px}.nav button{border:0;background:transparent;color:#dce8ff;text-align:left;padding:13px 14px;border-radius:14px;font-weight:800;font-size:16px;cursor:pointer}.nav button.active,.nav button:hover{background:#ffffff18;color:#fff}.sidebar-foot{margin-top:auto;border-top:1px solid #ffffff22;padding-top:15px;color:#dce8ff}.sidebar-foot .who{font-weight:800;color:#fff;margin-bottom:5px}.main{min-width:0}.topbar{height:74px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:15}.top-left,.top-right{display:flex;align-items:center;gap:12px}.mini-logo{width:38px;height:31px}.app-title{font-size:20px;font-weight:900}.sync{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:999px;background:#edf7f2;color:#05603a;font-weight:800}.sync:before{content:'';width:9px;height:9px;border-radius:50%;background:#12b76a;box-shadow:0 0 0 5px #12b76a1b}.preview{padding:6px 9px;border-radius:999px;background:#eef4ff;color:#3538cd;font-weight:900;font-size:12px}.content{padding:28px;max-width:1650px;margin:auto}.title-row{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}.title-row h1{font-size:30px;margin:0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.card,.kpi{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.kpi{padding:20px}.kpi .label{color:var(--muted);font-weight:700}.kpi .n{font-size:30px;font-weight:900;margin-top:8px}.card{padding:20px;margin-top:15px;overflow:auto}.row2{display:grid;grid-template-columns:1.35fr 1fr;gap:15px}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select{width:auto;min-width:190px}.field{display:grid;gap:6px}.field label{font-weight:800}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.section-title{font-size:18px;font-weight:900;margin:0 0 4px}.section-sub{color:var(--muted);margin:0 0 15px}input,select,textarea{width:100%;padding:12px 13px;border:1px solid #d0d5dd;border-radius:12px;background:#fff;color:#101828}textarea{min-height:85px;resize:vertical}.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:900;cursor:pointer}.btn.primary{background:linear-gradient(135deg,#075ee8,#0b78ff);color:#fff}.btn.soft{background:#eaf2ff;color:#0b57d0}.btn.ok{background:#dcfae6;color:#067647}.btn.warn{background:#fef0c7;color:#b54708}.btn.danger{background:#fee4e2;color:#b42318}.btn.dark{background:#101828;color:#fff}.btn.sm{padding:7px 9px;font-size:12px}.btn:disabled{opacity:.55;cursor:not-allowed}.table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{text-align:left;padding:12px 10px;border-bottom:1px solid #eef1f5;vertical-align:top}.table th{font-size:12px;color:#475467;text-transform:uppercase;letter-spacing:.04em;background:#fafbfc;position:sticky;top:0}.badge{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:900;background:#f2f4f7;color:#344054}.badge.ok{background:#dcfae6;color:#067647}.badge.warn{background:#fef0c7;color:#b54708}.badge.bad{background:#fee4e2;color:#b42318}.actions{display:flex;gap:7px;flex-wrap:wrap}.notice{padding:13px 14px;border-radius:13px;background:#fff4cf;color:#7a4c00;margin:12px 0;border:1px solid #ffe4a3}.notice.good{background:#ecfdf3;color:#05603a;border-color:#abefc6}.notice.bad{background:#fff1f0;color:#912018;border-color:#fecdca}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#f5f8ff,#edf3ff)}.login-card{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:25px;padding:30px;box-shadow:0 25px 80px #102a5620}.login-brand{display:flex;align-items:center;gap:14px}.login-brand svg{width:76px;height:60px}.login-brand strong{font-size:27px}.login-card h1{margin:28px 0 5px}.login-card .btn{width:100%;margin-top:18px}.error{color:var(--bad);font-weight:800;margin-top:12px}.drawer-back{position:fixed;inset:0;background:#10182866;z-index:49}.drawer{position:fixed;inset:0 0 0 auto;width:min(660px,100%);background:#fff;z-index:50;padding:24px;overflow:auto;box-shadow:-20px 0 60px #10182828}.drawer h2{margin:12px 0 5px}.doc{border:1px solid var(--line);border-radius:14px;padding:13px;margin:9px 0}.setting-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.setting-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.switch-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid #f0f2f5}.switch-row:last-child{border-bottom:0}.switch{position:relative;width:46px;height:26px}.switch input{display:none}.switch span{position:absolute;inset:0;background:#d0d5dd;border-radius:999px;cursor:pointer}.switch span:before{content:'';position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}.switch input:checked+span{background:#0b69ff}.switch input:checked+span:before{transform:translateX(20px)}.export-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.export-card{padding:20px;border:1px solid var(--line);border-radius:18px;background:#fff}.money{font-weight:900}.mobile-menu{display:none}.footer-note{font-size:12px;color:#98a2b3;margin-top:16px}.empty{padding:28px;text-align:center;color:#667085}.chart{height:220px;display:flex;gap:8px;align-items:flex-end;padding-top:25px}.bar{flex:1;min-width:12px;background:linear-gradient(180deg,#25d8ff,#0b69ff);border-radius:9px 9px 0 0;position:relative}.bar span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:10px;color:#667085;white-space:nowrap}.modal-back{position:fixed;inset:0;background:#10182877;z-index:70;display:grid;place-items:center;padding:20px}.modal{width:min(520px,100%);background:#fff;border-radius:20px;padding:22px;box-shadow:0 24px 80px #0003}.modal h3{margin-top:0}.modal .actions{justify-content:flex-end;margin-top:16px}@media(max-width:1050px){.shell{grid-template-columns:1fr}.sidebar{display:none;position:fixed;z-index:40;width:275px}.sidebar.open{display:flex}.mobile-menu{display:inline-flex}.grid{grid-template-columns:repeat(2,1fr)}.row2,.setting-grid,.export-grid{grid-template-columns:1fr}.content{padding:18px}}@media(max-width:620px){.grid,.fields{grid-template-columns:1fr}.topbar{padding:0 12px}.content{padding:14px}.app-title{font-size:17px}.sync{display:none}}

<section id="login" class="login"><form id="loginForm" class="login-card"><div class="login-brand"><svg viewBox="0 0 512 512" aria-label="FAST"><defs><linearGradient id="lg1" x1="90" y1="60" x2="470" y2="180"><stop stop-color="#0a43c9"/><stop offset=".45" stop-color="#078cff"/><stop offset="1" stop-color="#25d8ff"/></linearGradient><linearGradient id="lg2" x1="110" y1="190" x2="440" y2="455"><stop stop-color="#052c88"/><stop offset=".55" stop-color="#087fff"/><stop offset="1" stop-color="#13ccff"/></linearGradient></defs><path d="M181 72C202 51 232 42 272 42h211c-10 34-32 56-68 67H232c-27 0-46 8-60 26l-27 34H94c18-43 46-75 87-97Z" fill="url(#lg1)"/><path d="M211 199h241c-11 32-31 53-64 64H286l-77 193H111l88-220c6-16 10-28 12-37Z" fill="url(#lg2)"/><rect x="28" y="210" width="170" height="21" rx="10" fill="#25d8ff"/><rect x="49" y="249" width="145" height="19" rx="9" fill="#1abfff"/><rect x="82" y="286" width="105" height="18" rx="9" fill="#0b69ff"/></svg><div><strong>FAST ERP</strong><div class="muted" style="font-weight:800">Administration VTC</div></div></div><h1>Connexion administrateur</h1><p class="muted">ERP connecté à l’application FAST et à la base Supabase de production.</p><div class="field"><label>Identifiant</label><input id="username" value="admin" autocomplete="username"></div><div class="field"><label>Mot de passe</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn primary" type="submit">Se connecter</button><div id="loginError" class="error"></div><p class="footer-note">Environnement preview — non indexé.</p></form></section>
<div id="app" class="shell hidden"><aside id="sidebar" class="sidebar"><div class="brand"><svg class="brand-logo" viewBox="0 0 512 512" aria-label="FAST"><defs><linearGradient id="sg1" x1="90" y1="60" x2="470" y2="180"><stop stop-color="#39e7ff"/><stop offset=".6" stop-color="#189bff"/><stop offset="1" stop-color="#77f6ff"/></linearGradient><linearGradient id="sg2" x1="110" y1="190" x2="440" y2="455"><stop stop-color="#1eb3ff"/><stop offset="1" stop-color="#3ee8ff"/></linearGradient></defs><path d="M181 72C202 51 232 42 272 42h211c-10 34-32 56-68 67H232c-27 0-46 8-60 26l-27 34H94c18-43 46-75 87-97Z" fill="url(#sg1)"/><path d="M211 199h241c-11 32-31 53-64 64H286l-77 193H111l88-220c6-16 10-28 12-37Z" fill="url(#sg2)"/><rect x="28" y="210" width="170" height="21" rx="10" fill="#35eaff"/><rect x="49" y="249" width="145" height="19" rx="9" fill="#21ceff"/><rect x="82" y="286" width="105" height="18" rx="9" fill="#12a8ff"/></svg><div class="brand-text"><strong>FAST ERP</strong><small>ADMINISTRATION</small></div></div><nav id="nav" class="nav"></nav><div class="sidebar-foot"><div id="identity" class="who"></div><div>Connexion Supabase production</div><button id="logout" class="btn sm soft" style="margin-top:10px">Se déconnecter</button></div></aside><main class="main"><header class="topbar"><div class="top-left"><button id="menu" class="btn soft mobile-menu">☰</button><svg class="mini-logo" viewBox="0 0 512 512"><path d="M181 72C202 51 232 42 272 42h211c-10 34-32 56-68 67H232c-27 0-46 8-60 26l-27 34H94c18-43 46-75 87-97Z" fill="#0b69ff"/><path d="M211 199h241c-11 32-31 53-64 64H286l-77 193H111l88-220c6-16 10-28 12-37Z" fill="#0b69ff"/></svg><span class="app-title">FAST Administration</span><span class="preview">PREVIEW</span><span class="sync">APP CONNECTÉE</span></div><div class="top-right"><span id="syncedAt" class="muted"></span><button id="refresh" class="btn soft">Actualiser</button></div></header><div id="content" class="content"></div></main></div><div id="overlay"></div><div id="modal"></div>
<script>
const API='https://hmwxwzfcpdvgzjgxruup.supabase.co/functions/v1/fast-erp-api-v2';const ADMIN_API='https://hmwxwzfcpdvgzjgxruup.supabase.co/functions/v1/fast-erp-admin-actions';const pages=[['dashboard','Tableau de bord'],['drivers','Chauffeurs'],['clients','Clients'],['rides','Courses'],['accounting','Comptabilité'],['pricing','Tarification'],['settings','Paramètres'],['exports','Exports Excel']];let state={token:sessionStorage.getItem('fastErpToken')||'',identity:sessionStorage.getItem('fastErpIdentity')||'',data:null,page:'dashboard',syncedAt:null,timer:null};const $=id=>document.getElementById(id);const fmt=(n,c='XAF')=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:c||'XAF',maximumFractionDigits:(c||'XAF')==='XAF'?0:2}).format(Number(n||0));const dt=v=>v?new Date(v).toLocaleString('fr-FR'):'—';function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function badge(v){const x=String(v||'—'),l=x.toLowerCase(),c=['validated','approved','completed','paid','available','verified','actif','remboursé'].some(k=>l.includes(k))?'ok':['invalidated','rejected','cancelled','failed','désactivé'].some(k=>l.includes(k))?'bad':'warn';return `<span class="badge ${c}">${esc(x)}</span>`}async function api(path,opt={}){const h={'Content-Type':'application/json',...(opt.headers||{})};if(state.token)h['x-fast-admin-token']=state.token;const r=await fetch(API+path,{...opt,headers:h});const j=await r.json().catch(()=>({}));if(!r.ok){if(r.status===401)logout();const e=new Error(j.error||'Erreur API');e.data=j;e.status=r.status;throw e}return j}async function adminApi(path,body){const r=await fetch(ADMIN_API+path,{method:'POST',headers:{'Content-Type':'application/json','x-fast-admin-token':state.token},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.error||'Erreur administrateur');e.data=j;e.status=r.status;throw e}return j}async function load(silent=false){try{const j=await api('/snapshot');state.data=j.data;state.syncedAt=j.synced_at||new Date().toISOString();$('syncedAt').textContent='Synchronisé '+new Date(state.syncedAt).toLocaleTimeString('fr-FR');render()}catch(e){if(!silent)alert(e.message)}}function nav(){$('nav').innerHTML=pages.map(([id,label])=>`<button data-page="${id}" class="${state.page===id?'active':''}">${label}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;nav();render();$('sidebar').classList.remove('open')})}function controls(){return new Map((state.data?.account_admin_controls||[]).map(c=>[c.user_id,c]))}function profileMap(){return new Map((state.data?.profiles||[]).map(p=>[p.id,p]))}function paymentMap(){return new Map((state.data?.payments||[]).map(p=>[p.ride_id,p]))}function revenue(r){return Number(r.final_price??r.agreed_price??r.estimated_price??0)}function dashboard(){const d=state.data||{},rides=d.rides||[],profiles=d.profiles||[],drivers=d.drivers||[],done=rides.filter(r=>r.status==='completed'),active=rides.filter(r=>['searching','accepted','driver_arriving','in_progress'].includes(r.status)),rev=done.reduce((s,r)=>s+revenue(r),0),pendingDocs=(d.driver_documents||[]).filter(x=>x.status==='pending').length,pendingAccounts=(d.account_admin_controls||[]).filter(x=>x.admin_status==='pending').length;const byDay={};done.forEach(r=>{const k=(r.completed_at||r.created_at||'').slice(0,10);byDay[k]=(byDay[k]||0)+revenue(r)});const vals=Object.entries(byDay).slice(-14),max=Math.max(1,...vals.map(x=>x[1]));return `<div class="title-row"><div><h1>Tableau de bord</h1><div class="muted">Vue d'ensemble FAST VTC</div></div><button class="btn primary" onclick="load()">Actualiser les données</button></div><div class="grid"><div class="kpi"><div class="label">Clients</div><div class="n">${profiles.filter(p=>p.role==='client').length}</div></div><div class="kpi"><div class="label">Chauffeurs</div><div class="n">${drivers.length}</div></div><div class="kpi"><div class="label">Courses actives</div><div class="n">${active.length}</div></div><div class="kpi"><div class="label">CA courses terminées</div><div class="n">${fmt(rev)}</div></div></div><div class="row2"><div class="card"><h3>Chiffre d'affaires récent</h3><div class="chart">${vals.length?vals.map(([k,v])=>`<div class="bar" style="height:${Math.max(5,v/max*180)}px" title="${k} • ${fmt(v)}"><span>${Math.round(v/1000)}k</span></div>`).join(''):'<div class="empty">Aucune course terminée</div>'}</div></div><div class="card"><h3>À traiter</h3><p><b>${pendingDocs}</b> document(s) chauffeur en attente</p><p><b>${pendingAccounts}</b> compte(s) en attente de validation</p><p><b>${drivers.filter(x=>x.status==='available').length}</b> chauffeur(s) en ligne</p><p><b>${(d.payments||[]).filter(p=>p.status==='paid').length}</b> paiement(s) encaissé(s)</p></div></div>`}function driverRows(q='',status=''){const d=state.data,p=profileMap(),c=controls();return (d.drivers||[]).filter(x=>{const pr=p.get(x.user_id)||{};const okText=`${pr.first_name||''} ${pr.last_name||''} ${pr.email||''} ${pr.phone||''} ${x.user_id}`.toLowerCase().includes(q.toLowerCase());return okText&&(!status||x.status===status)}).map(x=>{const pr=p.get(x.user_id)||{},ctrl=c.get(x.user_id)||{admin_status:'pending',is_active:true};const blocked=ctrl.is_active===false||ctrl.admin_status==='invalidated';return `<tr><td><b>${esc((pr.first_name||'')+' '+(pr.last_name||''))}</b><br><span class="muted">${esc(pr.email||pr.phone||x.user_id)}</span></td><td>${badge(x.status)}</td><td>${badge(ctrl.admin_status||'pending')}</td><td>${ctrl.is_active===false?badge('Désactivé'):badge('Actif')}</td><td>${x.is_verified?badge('Vérifié'):badge('Non vérifié')}</td><td>${Number(x.rating||0).toFixed(1)}</td><td><div class="actions"><button class="btn sm soft" onclick="openDriver('${x.user_id}')">Ouvrir</button>${blocked?`<button class="btn sm ok" onclick="unblockAccount('${x.user_id}','driver')">Débloquer</button>`:''}</div></td></tr>`}).join('')}function drivers(){return `<div class="title-row"><div><h1>Chauffeurs</h1><div class="muted">Validation, documents, conformité et déblocage de comptes.</div></div></div><div class="card"><div class="toolbar"><input id="driverSearch" placeholder="Rechercher un chauffeur"><select id="driverStatus"><option value="">Tous les statuts</option><option value="offline">Hors ligne</option><option value="available">Disponible</option><option value="busy">Occupé</option></select></div><table class="table"><thead><tr><th>Chauffeur</th><th>Disponibilité</th><th>Statut admin</th><th>Compte</th><th>Conformité</th><th>Note</th><th>Actions</th></tr></thead><tbody id="driverBody">${driverRows()}</tbody></table></div>`}function clients(){const d=state.data,pays=d.rides||[],c=controls();const rows=(d.profiles||[]).filter(p=>p.role==='client').map(p=>{const ctrl=c.get(p.id)||{admin_status:'pending',is_active:true},blocked=ctrl.is_active===false||ctrl.admin_status==='invalidated';return `<tr><td><b>${esc((p.first_name||'')+' '+(p.last_name||''))}</b><br><span class="muted">${esc(p.email||p.phone||p.id)}</span></td><td>${badge(ctrl.admin_status||'pending')}</td><td>${ctrl.is_active===false?badge('Désactivé'):badge('Actif')}</td><td>${pays.filter(r=>r.client_id===p.id).length}</td><td><div class="actions"><button class="btn sm ok" onclick="accountControl('${p.id}','client','validated',true)">Valider</button><button class="btn sm danger" onclick="accountControl('${p.id}','client','invalidated',false)">Bloquer</button>${blocked?`<button class="btn sm primary" onclick="unblockAccount('${p.id}','client')">Débloquer</button>`:''}</div></td></tr>`}).join('');return `<div class="title-row"><div><h1>Clients</h1><div class="muted">Gestion des comptes, validations et blocages.</div></div></div><div class="card"><table class="table"><thead><tr><th>Client</th><th>Statut admin</th><th>Compte</th><th>Courses</th><th>Actions</th></tr></thead><tbody>${rows||'<tr><td colspan="5" cla oad();alert(r.manual?'Remboursement manuel enregistré.':'Remboursement envoyé au prestataire et enregistré.')}catch(e){if(e.data?.manual_confirmation_required&&!manualConfirmed){if(confirm('Ce moyen de paiement ne peut pas être remboursé automatiquement. Confirmer que le remboursement a été effectué manuellement ?'))return confirmRefund(paymentId,rideId,true)}alert(e.message)}};window.editRidePrice=async(id,current)=>{const price=Number(prompt('Nouveau prix :',current));if(!(price>0))return;try{await api('/ride/price',{method:'POST',body:JSON.stringify({id,price})});await load()}catch(e){alert(e.message)}};window.cancelRide=async id=>{const reason=prompt('Motif d’annulation :','Annulation administrateur');if(!reason||!confirm('Confirmer l’annulation de cette course ?'))return;try{await api('/ride/cancel',{method:'POST',body:JSON.stringify({id,reason})});await load()}catch(e){alert(e.message)}};window.editPricing=async p=>{const fields=[['base_fare','Prise en charge'],['per_km','Prix / km'],['per_minute','Prix / min'],['minimum_fare','Minimum'],['booking_fee','Frais de réservation'],['night_multiplier','Majoration nuit'],['weekend_multiplier','Majoration week-end'],['holiday_multiplier','Majoration jour férié']];const b={id:p.id,currency:p.currency};for(const [k,l] of fields){const v=prompt(l,p[k]);if(v===null)return;b[k]=Number(v)}try{await api('/pricing/update',{method:'POST',body:JSON.stringify(b)});await load()}catch(e){alert(e.message)}};async function saveSetting(key,value){await api('/settings/save',{method:'POST',body:JSON.stringify({key,value})})}window.saveAllSettings=async()=>{const defs=[['company_name',$('set_company_name').value.trim()],['support_phone',$('set_support_phone').value.trim()],['support_email',$('set_support_email').value.trim()],['service_start',$('set_service_start').value],['service_end',$('set_service_end').value],['driver_search_timeout',Number($('set_driver_search_timeout').value||90)],['service_enabled',$('set_service_enabled').checked],['cash_enabled',$('set_cash_enabled').checked],['card_enabled',$('set_card_enabled').checked],['mobile_money_enabled',$('set_mobile_money_enabled').checked],['block_unverified_drivers',$('set_block_unverified_drivers').checked],['block_expired_documents',$('set_block_expired_documents').checked],['admin_refund_confirmation',$('set_admin_refund_confirmation').checked],['notify_new_driver',$('set_notify_new_driver').checked],['notify_new_client',$('set_notify_new_client').checked],['notify_pending_document',$('set_notify_pending_document').checked],['notify_payment_failure',$('set_notify_payment_failure').checked]];try{for(const [k,v] of defs)await saveSetting(k,v);await load();alert('Paramètres enregistrés.')}catch(e){alert(e.message)}};window.exportXlsx=type=>{const d=state.data,c=controls(),p=profileMap();let rows=[];if(type==='rides')rows=d.rides||[];if(type==='drivers')rows=(d.drivers||[]).map(x=>({...x,...(p.get(x.user_id)||{}),admin_status:(c.get(x.user_id)||{}).admin_status||'pending',account_active:(c.get(x.user_id)||{}).is_active!==false}));if(type==='clients')rows=(d.profiles||[]).filter(x=>x.role==='client').map(x=>({...x,admin_status:(c.get(x.id)||{}).admin_status||'pending',account_active:(c.get(x.id)||{}).is_active!==false}));const ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,type);XLSX.writeFile(wb,`FAST-${type}-${new Date().toISOString().slice(0,10)}.xlsx`)};window.exportAccounting=()=>{const d=state.data,p=profileMap(),rows=accountingRows(),journal=rows.map((x,i)=>{const r=x.ride,cl=p.get(r.client_id)||{},dr=p.get(r.driver_id)||{},pay=x.pay;return{'Date':(r.completed_at||r.created_at||'').slice(0,10),'N° pièce':`VTC-${String(i+1).padStart(6,'0')}`,'Référence course':r.id,'Client':`${cl.first_name||''} ${cl.last_name||''}`.trim(),'Chauffeur':`${dr.first_name||''} ${dr.last_name||''}`.trim(),'Mode paiement':pay?.method_type||r.payment_method||'','Statut paiement':pay?.status||'','Montant course':x.gross,'Commission FAST':x.commission,'Part chauffeur':x.driverShare,'Montant encaissé':pay?.status==='paid'?Number(pay.amount||x.gross):0,'Remboursé':pay?.status==='refunded'?Number(pay.amount||0):0,'Reste à encaisser':pay?.status==='paid'||pay?.status==='refunded'?0:x.gross,'Devise':r.currency||'XAF','Compte débit':'512/531','Compte crédit':'706/467','Libellé':`Course VTC ${r.id}`}});const monthly={};journal.forEach(j=>{const m=j.Date.slice(0,7);monthly[m]??={Mois:m,'Chiffre d’affaires':0,'Commissions FAST':0,'Parts chauffeurs':0,'Encaissements':0,'Remboursements':0};monthly[m]['Chiffre d’affaires']+=Number(j['Montant course']||0);monthly[m]['Commissions FAST']+=Number(j['Commission FAST']||0);monthly[m]['Parts chauffeurs']+=Number(j['Part chauffeur']||0);monthly[m]['Encaissements']+=Number(j['Montant encaissé']||0);monthly[m]['Remboursements']+=Number(j['Remboursé']||0)});const notes=[{Information:'Export FAST ERP — tableau comptable de gestion VTC'},{Information:'Les comptes comptables sont indicatifs et doivent être adaptés au plan comptable retenu par l’entreprise.'},{Information:'Les courses sans règle de commission conservent une commission vide afin de ne pas inventer un bénéfice.'}];const wb=XLSX.utils.book_new();[['Journal comptable',journal],['Synthèse mensuelle',Object.values(monthly)],['Courses terminées',rows.map(x=>x.ride)],['Commissions',d.commission_rules||[]],['Paiements',d.payments||[]],['Notes',notes]].forEach(([name,data])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(data),name));XLSX.writeFile(wb,`FAST-Comptabilite-VTC-${new Date().toISOString().slice(0,10)}.xlsx`)};async function login(e){e.preventDefault();$('loginError').textContent='';try{const j=await api('/login',{method:'POST',body:JSON.stringify({username:$('username').value,password:$('password').value})});state.token=j.token;state.identity=j.identity;sessionStorage.setItem('fastErpToken',j.token);sessionStorage.setItem('fastErpIdentity',j.identity);boot()}catch(err){$('logi
