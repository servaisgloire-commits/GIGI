plugins { id 'com.android.application' }

android {
    namespace 'com.fastn1.connect'
    compileSdk 35

    defaultConfig {
        applicationId 'com.fastn1.connect'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
