<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b57d0">
  <title>FAST N°1 • Nouveau mot de passe</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:linear-gradient(180deg,#eef5ff 0,#f7f9fc 45%,#fff 100%);font-family:Arial,Helvetica,sans-serif;color:#101828;display:flex;align-items:flex-start;justify-content:center}
    .wrap{width:100%;max-width:470px;padding:34px 18px 28px}
    .logo{display:flex;align-items:center;gap:10px;margin-bottom:22px;font-size:29px;font-weight:900;color:#0b57d0;letter-spacing:-.8px}
    .mark{width:42px;height:42px;border-radius:14px;background:#0b57d0;color:#fff;display:grid;place-items:center;font-size:22px;box-shadow:0 10px 25px rgba(11,87,208,.22)}
    .card{background:#fff;border:1px solid #e4eaf2;border-radius:24px;padding:26px 22px;box-shadow:0 22px 60px rgba(16,24,40,.10)}
    h1{font-size:25px;line-height:1.2;margin:0 0 10px;letter-spacing:-.4px}
    .sub{margin:0 0 22px;color:#667085;line-height:1.5;font-size:15px}
    label{display:block;font-size:13px;font-weight:700;margin:14px 0 7px;color:#344054}
    .field{width:100%;padding:15px 14px;border:1px solid #d0d5dd;border-radius:13px;font-size:16px;outline:none;background:#fff}
    .field:focus{border-color:#0b57d0;box-shadow:0 0 0 4px rgba(11,87,208,.10)}
    .btn{width:100%;margin-top:20px;border:0;border-radius:13px;padding:15px 16px;background:#0b57d0;color:#fff;font-size:16px;font-weight:800;cursor:pointer}
    .btn:disabled{opacity:.55;cursor:not-allowed}
    .msg{display:none;margin-top:16px;padding:13px 14px;border-radius:12px;font-size:14px;line-height:1.45}
    .ok{display:block;background:#ecfdf3;color:#027a48;border:1px solid #abefc6}
    .err{display:block;background:#fef3f2;color:#b42318;border:1px solid #fecdca}
    .info{display:block;background:#eff8ff;color:#175cd3;border:1px solid #b2ddff}
    .foot{margin-top:18px;text-align:center;color:#98a2b3;font-size:12px}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="logo"><div class="mark">F</div>FAST N°1</div>
    <section class="card">
      <h1>Choisissez un nouveau mot de passe</h1>
      <p class="sub">Votre lien FAST est sécurisé et utilisable une seule fois. Choisissez un mot de passe d’au moins 8 caractères.</p>

      <label for="p1">Nouveau mot de passe</label>
      <input id="p1" class="field" type="password" minlength="8" autocomplete="new-password" placeholder="8 caractères minimum">

      <label for="p2">Confirmer le mot de passe</label>
      <input id="p2" class="field" type="password" minlength="8" autocomplete="new-password" placeholder="Retapez le mot de passe">

      <button id="save" class="btn" disabled>Vérification du lien…</button>
      <div id="msg" class="msg"></div>
    </section>
    <div class="foot">FAST N°1 • Gloire Group</div>
  </main>

  <script>
    const SUPABASE_URL='https://hmwxwzfcpdvgzjgxruup.supabase.co';
    const KEY='sb_publishable_RYYcI3j1QU9LAUa-0s1eZQ_x6HpDr38';
    const qs=new URLSearchParams(location.search);
    const hash=new URLSearchParams(location.hash.slice(1));
    let accessToken=hash.get('access_token')||'';
    let tokenHash=qs.get('token_hash')||'';
    const save=document.getElementById('save');
    const msg=document.getElementById('msg');

    function show(text,kind){
      msg.textContent=text;
      msg.className='msg '+kind;
    }

    function ready(){
      if(accessToken||tokenHash){
        save.disabled=false;
        save.textContent='Enregistrer le nouveau mot de passe';
        if(location.hash) history.replaceState(null,'',location.pathname+location.search);
      }else{
        save.disabled=true;
        save.textContent='Lien invalide';
        show('Ce lien est invalide ou a expiré. Demandez un nouveau lien depuis FAST.','err');
      }
    }

    async function exchangeTokenHash(){
      if(accessToken) return accessToken;
      if(!tokenHash) throw new Error('Lien de réinitialisation invalide.');
      const r=await fetch(SUPABASE_URL+'/auth/v1/verify',{
        method:'POST',
        headers:{'apikey':KEY,'Content-Type':'application/json'},
        body:JSON.stringify({type:'recovery',token_hash:tokenHash})
      });
      let d={}; try{d=await r.json()}catch(_){ }
      if(!r.ok) throw new Error(d.message||d.error_description||'Ce lien est invalide ou a expiré.');
      accessToken=d.access_token||(d.session&&d.session.access_token)||'';
      if(!accessToken) throw new Error('Impossible de valider ce lien. Demandez-en un nouveau.');
      tokenHash='';
      return accessToken;
    }

    save.addEventListener('click',async()=>{
      const p1=document.getElementById('p1').value;
      const p2=document.getElementById('p2').value;
      if(p1.length<8) return show('Le mot de passe doit contenir au moins 8 caractères.','err');
      if(p1!==p2) return show('Les deux mots de passe ne correspondent pas.','err');
      save.disabled=true;
      save.textContent='Enregistrement…';
      show('Vérification sécurisée en cours…','info');
      try{
        const token=await exchangeTokenHash();
        const r=await fetch(SUPABASE_URL+'/auth/v1/user',{
          method:'PUT',
          headers:{'apikey':KEY,'Authorization':'Bearer '+token,'Content-Type':'application/json'},
          body:JSON.stringify({password:p1})
        });
        let d={}; try{d=await r.json()}catch(_){ }
        if(!r.ok) throw new Error(d.message||d.error_description||'Modification impossible.');
        accessToken='';
        show('Mot de passe modifié avec succès. Vous pouvez maintenant revenir dans FAST et vous connecter.','ok');
        save.textContent='Mot de passe enregistré';
        document.getElementById('p1').disabled=true;
        document.getElementById('p2').disabled=true;
      }catch(e){
        show(String(e&&e.message?e.message:e),'err');
        save.disabled=false;
        save.textContent='Réessayer';
      }
    });

    ready();
  </script>
</body>
</html>
