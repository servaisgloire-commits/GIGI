<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>*{box-sizing:border-box}body{margin:0;background:#05080d;color:#f8fafc;font-family:system-ui}.app{padding:22px}.logo{width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,#24c965,#0ea5e9);display:grid;place-items:center;font-size:34px;font-weight:950;font-style:italic}.hero{padding:38px 0 22px}.hero h1{font-size:40px;margin:0}.muted{color:#91a0b4;font-size:12px}.card{background:#101823;border:1px solid #223044;border-radius:20px;padding:17px;margin:12px 0}.button{width:100%;border:0;border-radius:16px;padding:16px;background:linear-gradient(135deg,#149646,#2bd46b);color:white;font-weight:900;font-size:16px;margin-top:14px}.status{display:flex;justify-content:space-between;gap:10px}.pill{background:#12261a;color:#66df8b;border-radius:99px;padding:7px 10px;font-size:11px;height:max-content}.pill.off{background:#301419;color:#ff8c96}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{font-size:20px;font-weight:900;margin-top:4px}</style></head><body><main class="app"><div class="logo">F</div><section class="hero"><div class="muted">FAST N°1</div><h1>Bougeons mieux.</h1><p class="muted">Android → Python → Supabase</p></section><div class="card"><div class="status"><div><b>Supabase</b><div id="supa" class="muted">Configuration…</div></div><span class="pill">CONFIGURÉ</span></div></div><div class="card"><div class="status"><div><b>Backend Python</b><div id="python" class="muted">Test de connexion…</div></div><span id="apiBadge" class="pill off">HORS LIGNE</span></div></div><div class="grid"><div class="card"><div class="muted">Version</div><div id="version" class="metric">—</div></div><div class="card"><div class="muted">Dispatch</div><div class="metric">Python</div></div></div><button class="button" onclick="checkApi()">Tester le backend FAST</button><p id="msg" class="muted"></p></main><script>let api='';try{supa.textContent=FASTNative.supabaseUrl().replace('https://','');api=FASTNative.pythonApiUrl();python.textContent=api;version.textContent=FASTNative.appVersion()}catch(e){supa.textContent='Mode navigateur';version.textContent='web'}async function checkApi(){msg.textContent='Connexion au backend Python…';try{const r=await fetch(api+'/health');if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();apiBadge.textContent='EN LIGNE';apiBadge.classList.remove('off');python.textContent='FAST Python API connectée';msg.textContent='Python répond. Supabase serveur : '+(j.supabase_configured?'configuré':'clé serveur à configurer')}catch(e){apiBadge.textContent='HORS LIGNE';apiBadge.classList.add('off');msg.textContent='Le code est connecté, mais le serveur Python doit être déployé sur une URL HTTPS réelle.'}}window.addEventListener('load',()=>setTimeout(checkApi,500));</script></body></html>
