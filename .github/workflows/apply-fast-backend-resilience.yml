name: Apply FAST backend resilience

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-fast-backend-resilience.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply retry and fallback patch
        run: python tools/patch_fast_backend_resilience.py
      - name: Validate Python
        run: python -m py_compile backend/app/main.py
      - name: Commit hardened backend
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- backend/app/main.py; then
            echo 'Backend already hardened.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/main.py
          git commit -m 'Harden FAST backend against transient Supabase timeouts'
          git push
