name: Build FAST Android

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FAST_GOOGLE_MAPS_API_KEY: ${{ secrets.FAST_GOOGLE_MAPS_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check JavaScript syntax
        run: |
          for f in app/src/main/assets/*.js; do node --check "$f"; done
      - name: Check backend syntax
        run: python -m py_compile backend/app/flex_main.py
      - name: Verify FAST product, branding and Android hardening
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationId = "cg.fast.n1"' app/build.gradle.kts
          grep -q 'versionName = "6.0.3"' app/build.gradle.kts
          grep -q 'versionCode = 617' app/build.gradle.kts
          grep -q 'applicationIdSuffix = ".direct617"' app/build.gradle.kts
          test -s app/src/main/assets/fast-logo.svg
          grep -q 'android:icon="@drawable/fast_logo"' app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@drawable/fast_logo"' app/src/main/AndroidManifest.xml
          grep -q '#0B57D0' app/src/main/res/drawable/fast_logo.xml
          grep -q 'ensureOfficialBranding' app/src/main/assets/production-ui.js
          grep -q "logo.src='fast-logo.svg'" app/src/main/assets/production-ui.js
          grep -q 'WebViewAssetLoader' app/src/main/java/cg/fast/n1/MainActivity.kt
          grep -q 'allowFileAccess = false' app/src/main/java/cg/fast/n1/MainActivity.kt
          grep -q 'allowContentAccess = false' app/src/main/java/cg/fast/n1/MainActivity.kt
          grep -q 'web.destroy()' app/src/main/java/cg/fast/n1/MainActivity.kt
          grep -q '__fast_storage_probe__' app/src/main/assets/google-map-adapter.js
          grep -q 'liveMarker' app/src/main/assets/driver-motion.js
          if grep -RniE 'unpkg.com/maplibre|maplibre-gl.css|maplibre-gl.js|maplibregl' app/src/main/assets; then echo 'MapLibre runtime reference found'; exit 1; fi
          if grep -q 'REQUEST_INSTALL_PACKAGES' app/src/main/AndroidManifest.xml; then echo 'Unknown APK install permission must not be present'; exit 1; fi
          if grep -q 'DownloadManager' app/src/main/java/cg/fast/n1/MainActivity.kt; then echo 'Self APK downloader must not be present'; exit 1; fi
          if grep -q 'FileProvider' app/src/main/AndroidManifest.xml app/src/main/java/cg/fast/n1/MainActivity.kt; then echo 'APK installer FileProvider must not be present'; exit 1; fi
          if grep -q 'allowUniversalAccessFromFileURLs = true' app/src/main/java/cg/fast/n1/MainActivity.kt; then echo 'Unsafe universal file URL access enabled'; exit 1; fi
          python - <<'PY'
          from pathlib import Path
          surface = (Path('app/src/main/assets/index.html').read_text(encoding='utf-8') + '\n' + Path('app/src/main/assets/production-ui.js').read_text(encoding='utf-8')).lower()
          forbidden = ['prototype', 'bêta', 'coming soon', 'lorem ipsum']
          hits = [x for x in forbidden if x in surface]
          assert not hits, 'Signaux de brouillon dans l’application: ' + ', '.join(hits)
          PY
      - name: Build isolated Android install APK
        run: gradle assembleDirectInstall
      - name: Compile production release package
        run: gradle assembleRelease
      - name: Verify installable APK package and signature
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/directInstall/app-directInstall.apk'
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | tee /tmp/fast-badging.txt
          grep -q "package: name='cg.fast.n1.direct617'" /tmp/fast-badging.txt
          grep -q "versionCode='617'" /tmp/fast-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/fast-signature.txt
          grep -q 'Verifies' /tmp/fast-signature.txt
          cp "$APK" FAST-N1-v6.0.3-build617-ANDROID.apk
      - name: Upload verified Android APK
        uses: actions/upload-artifact@v4
        with:
          name: FAST-N1-v6.0.3-build617-android
          path: FAST-N1-v6.0.3-build617-ANDROID.apk
          retention-days: 14
      - name: Publish Android direct-download release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='fast-android-v6.0.3-build617'
          ASSET='FAST-N1-v6.0.3-build617-ANDROID.apk'
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "$ASSET" \
              --title 'FAST N°1 Android 6.0.3 (build 617)' \
              --notes 'APK Android d’installation directe, isolé des anciennes signatures de développement. Démarrage WebView renforcé, carte non bloquante et suivi chauffeur corrigé.'
          else
            gh release upload "$TAG" "$ASSET" --clobber
          fi
