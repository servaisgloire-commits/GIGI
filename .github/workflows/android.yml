name: Build FAST Android Stable

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FAST_KEYSTORE_B64: ${{ secrets.FAST_KEYSTORE_B64 }}
      FAST_KEYSTORE_PASSWORD: ${{ secrets.FAST_KEYSTORE_PASSWORD }}
      FAST_KEY_ALIAS: ${{ secrets.FAST_KEY_ALIAS }}
      FAST_KEY_PASSWORD: ${{ secrets.FAST_KEY_PASSWORD }}
      FAST_GOOGLE_MAPS_API_KEY: ${{ secrets.FAST_GOOGLE_MAPS_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Require stable FAST production signing
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FAST_KEYSTORE_B64:-}" ] || [ -z "${FAST_KEYSTORE_PASSWORD:-}" ] || [ -z "${FAST_KEY_ALIAS:-}" ] || [ -z "${FAST_KEY_PASSWORD:-}" ]; then
            echo "::error::FAST production signing secrets are missing. Build stopped to prevent an incompatible APK."
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/fast-production.jks"
          printf '%s' "$FAST_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$FAST_KEYSTORE_PASSWORD" -alias "$FAST_KEY_ALIAS" >/dev/null
          echo "FAST_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Force permanent Android package identity
        shell: bash
        run: |
          set -euo pipefail
          sed -i -E 's/applicationId = "[^"]+"/applicationId = "cg.fast.n1"/' app/build.gradle.kts
          sed -i -E '/applicationIdSuffix = "\.install[0-9]+"/d' app/build.gradle.kts
          sed -i '/versionNameSuffix = "-android"/d' app/build.gradle.kts
          grep -q 'applicationId = "cg.fast.n1"' app/build.gradle.kts
          if grep -q 'applicationIdSuffix = ".install' app/build.gradle.kts; then
            echo "::error::A version-specific package suffix is still present."
            exit 1
          fi

      - name: Read FAST version metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -1)"
          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts | head -1)"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          VERSION_SLUG="$(printf '%s' "$VERSION_NAME" | tr '.' '-' | tr -cd '[:alnum:]-')"
          APK_NAME="FAST-N1-${VERSION_SLUG}-ANDROID.apk"
          RELEASE_TAG="fast-n1-${VERSION_SLUG}"
          echo "FAST_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "FAST_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "FAST_VERSION_SLUG=$VERSION_SLUG" >> "$GITHUB_ENV"
          echo "FAST_APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "FAST_RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Check application JavaScript
        run: |
          for f in app/src/main/assets/*.js; do node --check "$f"; done

      - name: Build signed installable APK
        run: gradle clean assembleDirectInstall

      - name: Verify stable package and production certificate
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/directInstall/app-directInstall.apk'
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | tee /tmp/fast-badging.txt
          grep -q "package: name='cg.fast.n1'" /tmp/fast-badging.txt
          grep -q "versionCode='${FAST_VERSION_CODE}'" /tmp/fast-badging.txt
          grep -q "versionName='${FAST_VERSION_NAME}'" /tmp/fast-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/fast-signature.txt
          grep -q 'Verifies' /tmp/fast-signature.txt
          if grep -qi 'CN=Android Debug' /tmp/fast-signature.txt; then
            echo "::error::Debug signing detected. Publication forbidden."
            exit 1
          fi
          grep 'Signer: certificate SHA-256 digest' /tmp/fast-signature.txt

      - name: Prepare FAST APK
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/directInstall/app-directInstall.apk "$FAST_APK_NAME"
          sha256sum "$FAST_APK_NAME" > "${FAST_APK_NAME}.sha256"

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FAST-N1-stable-android
          path: |
            ${{ env.FAST_APK_NAME }}
            ${{ env.FAST_APK_NAME }}.sha256
          retention-days: 30

      - name: Publish official FAST download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES="FAST N°1 Android ${FAST_VERSION_NAME}. Package permanent cg.fast.n1 et signature de production stable."
          if gh release view "$FAST_RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$FAST_RELEASE_TAG" "$FAST_APK_NAME" "${FAST_APK_NAME}.sha256" --clobber
            gh release edit "$FAST_RELEASE_TAG" --notes "$NOTES"
          else
            gh release create "$FAST_RELEASE_TAG" "$FAST_APK_NAME" "${FAST_APK_NAME}.sha256" --title "FAST N°1 Android — ${FAST_VERSION_NAME}" --notes "$NOTES"
          fi

      - name: Point official FAST site to this APK automatically
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          export FAST_SOURCE_APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${FAST_RELEASE_TAG}/${FAST_APK_NAME}"
          python3 - <<'PY'
          import json, os
          path = 'updates/latest.json'
          with open(path, 'r', encoding='utf-8') as f:
              data = json.load(f)
          data['version'] = os.environ['FAST_VERSION_NAME']
          data['build'] = int(os.environ['FAST_VERSION_CODE'])
          data['sourceApkUrl'] = os.environ['FAST_SOURCE_APK_URL']
          data['fileName'] = os.environ['FAST_APK_NAME']
          data['platform'] = 'Android'
          data['url'] = 'https://fast-n1-officiel.vercel.app/#download'
          data['apkUrl'] = 'https://fast-n1-officiel.vercel.app/api/download'
          data['notes'] = f"FAST N°1 {os.environ['FAST_VERSION_NAME']} — dernière version Android validée et signée automatiquement."
          with open(path, 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY
          git config user.name 'FAST Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add updates/latest.json
          if git diff --cached --quiet; then
            echo 'Official download manifest already points to this APK.'
          else
            git commit -m "Update official FAST APK to ${FAST_VERSION_NAME}"
            git push origin HEAD:main
          fi

      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          script: |
            adb install "$FAST_APK_NAME"
            adb shell pm list packages | grep 'package:cg.fast.n1'
            adb shell am start -W -n cg.fast.n1/cg.fast.n1.MainActivity
            sleep 5
            adb shell dumpsys activity activities | grep 'cg.fast.n1'
