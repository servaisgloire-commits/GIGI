name: Build FAST Android Stable

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FAST_SIGNING_BROKER_URL: https://hmwxwzfcpdvgzjgxruup.supabase.co/functions/v1/fast-signing-broker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Acquire permanent FAST production signing
        shell: bash
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl -fsSL -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=fast-signing")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_JSON" | jq -r '.value')"
          test -n "$OIDC_TOKEN"
          echo "::add-mask::$OIDC_TOKEN"
          RESPONSE_FILE="$RUNNER_TEMP/fast-signing-response.json"
          HTTP_CODE="$(curl -sS -o "$RESPONSE_FILE" -w '%{http_code}' -X POST "$FAST_SIGNING_BROKER_URL" -H "Authorization: Bearer $OIDC_TOKEN" -H 'Content-Type: application/json' --data '{"action":"get"}')"
          test "$HTTP_CODE" = "200"
          KEYSTORE_B64="$(jq -r '.keystore_b64' "$RESPONSE_FILE")"
          STOREPASS="$(jq -r '.store_password' "$RESPONSE_FILE")"
          KEY_ALIAS="$(jq -r '.key_alias' "$RESPONSE_FILE")"
          KEYPASS="$(jq -r '.key_password' "$RESPONSE_FILE")"
          CERT_SHA256="$(jq -r '.cert_sha256' "$RESPONSE_FILE")"
          EXPECTED_FAST_CERT_SHA256="4B:56:27:CB:DC:9C:46:94:84:DC:4C:A7:D9:F0:5E:98:5E:A6:C8:27:56:A0:B7:FA:37:94:83:AE:21:C7:EA:52"
          test "$(printf '%s' "$CERT_SHA256" | tr '[:lower:]' '[:upper:]')" = "$EXPECTED_FAST_CERT_SHA256"
          echo "::add-mask::$STOREPASS"
          echo "::add-mask::$KEYPASS"
          echo "::add-mask::$KEYSTORE_B64"
          KEYSTORE="$RUNNER_TEMP/fast-production.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$STOREPASS" -alias "$KEY_ALIAS" >/dev/null
          echo "FAST_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "FAST_KEYSTORE_PASSWORD=$STOREPASS" >> "$GITHUB_ENV"
          echo "FAST_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "FAST_KEY_PASSWORD=$KEYPASS" >> "$GITHUB_ENV"
          echo "FAST_CERT_SHA256=$CERT_SHA256" >> "$GITHUB_ENV"

      - name: Acquire dedicated Android Maps key
        shell: bash
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl -fsSL -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=fast-signing")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_JSON" | jq -r '.value')"
          test -n "$OIDC_TOKEN"
          echo "::add-mask::$OIDC_TOKEN"
          RESPONSE_FILE="$RUNNER_TEMP/fast-maps-android-response.json"
          HTTP_CODE="$(curl -sS -o "$RESPONSE_FILE" -w '%{http_code}' -X POST "$FAST_SIGNING_BROKER_URL" -H "Authorization: Bearer $OIDC_TOKEN" -H 'Content-Type: application/json' --data '{"action":"get_maps_android_key"}')"
          test "$HTTP_CODE" = "200"
          MAPS_KEY="$(jq -r '.maps_api_key' "$RESPONSE_FILE")"
          test -n "$MAPS_KEY"
          test "$MAPS_KEY" != "null"
          echo "::add-mask::$MAPS_KEY"
          echo "FAST_GOOGLE_MAPS_API_KEY=$MAPS_KEY" >> "$GITHUB_ENV"

      - name: Read FAST version metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -1)"
          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts | head -1)"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          VERSION_SLUG="$(printf '%s' "$VERSION_NAME" | tr '.' '-' | tr -cd '[:alnum:]-')"
          echo "FAST_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "FAST_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "FAST_VERSION_SLUG=$VERSION_SLUG" >> "$GITHUB_ENV"
          echo "FAST_APK_NAME=FAST-N1-${VERSION_SLUG}-ANDROID.apk" >> "$GITHUB_ENV"
          echo "FAST_RELEASE_TAG=fast-n1-${VERSION_SLUG}" >> "$GITHUB_ENV"

      - name: Validate Android source
        shell: bash
        run: |
          set -euo pipefail
          for f in app/src/main/assets/*.js; do node --check "$f"; done
          grep -q 'applicationId = "cg.fast.n1.mobile"' app/build.gradle.kts
          grep -q 'versionName = "25.09.2026.4"' app/build.gradle.kts
          grep -q 'com.google.android.geo.API_KEY' app/src/main/AndroidManifest.xml
          grep -q 'FAST_NATIVE_MAP' app/src/main/java/cg/fast/n1/DriverMapActivity.kt
          test -n "$FAST_GOOGLE_MAPS_API_KEY"

      - name: Build signed installable APK
        run: gradle clean assembleRelease

      - name: Verify stable package and production certificate
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | tee /tmp/fast-badging.txt
          grep -q "package: name='cg.fast.n1.mobile'" /tmp/fast-badging.txt
          grep -q "versionCode='${FAST_VERSION_CODE}'" /tmp/fast-badging.txt
          grep -q "versionName='${FAST_VERSION_NAME}'" /tmp/fast-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/fast-signature.txt
          grep -q 'Verifies' /tmp/fast-signature.txt
          if grep -qi 'CN=Android Debug' /tmp/fast-signature.txt; then exit 1; fi
          ACTUAL_CERT="$(sed -n 's/.*certificate SHA-256 digest: //p' /tmp/fast-signature.txt | head -1 | tr '[:lower:]' '[:upper:]' | sed 's/../&:/g;s/:$//')"
          EXPECTED_CERT="4B:56:27:CB:DC:9C:46:94:84:DC:4C:A7:D9:F0:5E:98:5E:A6:C8:27:56:A0:B7:FA:37:94:83:AE:21:C7:EA:52"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT"
          unzip -t "$APK" >/dev/null
          APK_SIZE="$(stat -c%s "$APK")"
          echo "FAST_APK_SIZE_BYTES=$APK_SIZE"
          if [ "$APK_SIZE" -lt 4500000 ]; then
            echo "::error::APK unexpectedly small ($APK_SIZE bytes). Full non-minified build expected."
            exit 1
          fi
          cp "$APK" "$FAST_APK_NAME"
          sha256sum "$FAST_APK_NAME" > "${FAST_APK_NAME}.sha256"

      - name: Download previous official FAST APK for update test
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fast-previous"
          gh release download fast-n1-25-09-2026-3 \
            --pattern 'FAST-N1-25-09-2026-3-ANDROID.apk' \
            --dir "$RUNNER_TEMP/fast-previous"
          test -s "$RUNNER_TEMP/fast-previous/FAST-N1-25-09-2026-3-ANDROID.apk"

      - name: Prepare Android emulator acceleration
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm || true; fi
          ls -l /dev/kvm 2>/dev/null || true

      - name: Verify clean install on Android 23
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 23
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -eu
            adb uninstall cg.fast.n1.mobile >/dev/null 2>&1 || true
            adb install "$FAST_APK_NAME"
            adb shell pm list packages | grep 'package:cg.fast.n1.mobile'
            adb shell am start -W -n cg.fast.n1.mobile/cg.fast.n1.MainActivity
            adb shell dumpsys activity activities | grep 'cg.fast.n1.mobile'

      - name: Verify clean install on Android 26
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -eu
            adb uninstall cg.fast.n1.mobile >/dev/null 2>&1 || true
            adb install "$FAST_APK_NAME"
            adb shell pm list packages | grep 'package:cg.fast.n1.mobile'
            adb shell am start -W -n cg.fast.n1.mobile/cg.fast.n1.MainActivity
            adb shell dumpsys activity activities | grep 'cg.fast.n1.mobile'

      - name: Verify signed in-place update on Android 26
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -eu
            adb uninstall cg.fast.n1.mobile >/dev/null 2>&1 || true
            adb install "$RUNNER_TEMP/fast-previous/FAST-N1-25-09-2026-3-ANDROID.apk"
            adb shell dumpsys package cg.fast.n1.mobile | grep -E 'versionCode=25092028|versionName=25.09.2026.3'
            adb install -r "$FAST_APK_NAME"
            adb shell dumpsys package cg.fast.n1.mobile | grep -E 'versionCode=25092029|versionName=25.09.2026.4'
            adb shell am start -W -n cg.fast.n1.mobile/cg.fast.n1.MainActivity
            adb shell pidof cg.fast.n1.mobile

      - name: Verify native driver map on Android 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            set -eu
            adb uninstall cg.fast.n1.mobile >/dev/null 2>&1 || true
            adb uninstall cg.fast.n1 >/dev/null 2>&1 || true
            adb install "$FAST_APK_NAME"
            adb shell pm list packages | grep 'package:cg.fast.n1.mobile'
            adb shell am start -W -n cg.fast.n1.mobile/cg.fast.n1.MainActivity
            adb shell dumpsys activity activities | grep 'cg.fast.n1.mobile'
            adb logcat -c
            gradle :app:connectedVerificationAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=cg.fast.n1.DriverMapRuntimeTest
            sleep 2
            adb logcat -d > /tmp/fast-driver-map-logcat.txt
            grep -E 'FAST_NATIVE_MAP|Google Maps Android API|Authorization failure|API key|not authorized' /tmp/fast-driver-map-logcat.txt || true
            grep -q 'FAST_NATIVE_MAP.*map_ready' /tmp/fast-driver-map-logcat.txt
            if grep -Eqi 'Authorization failure|API key[^[:cntrl:]]*(invalid|rejected|not authorized)|not authorized to use this service' /tmp/fast-driver-map-logcat.txt; then echo 'Google Maps authorization error detected' >&2; exit 1; fi
            grep -q 'FAST_NATIVE_MAP.*map_loaded' /tmp/fast-driver-map-logcat.txt

      - name: Verify FAST main interface on Android 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            set -eu
            adb uninstall cg.fast.n1.mobile >/dev/null 2>&1 || true
            adb uninstall cg.fast.n1 >/dev/null 2>&1 || true
            adb install "$FAST_APK_NAME"
            adb shell pm list packages | grep 'package:cg.fast.n1.mobile'
            adb shell am start -W -n cg.fast.n1.mobile/cg.fast.n1.MainActivity
            adb shell dumpsys activity activities | grep 'cg.fast.n1.mobile'
            adb logcat -c
            gradle :app:connectedVerificationAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=cg.fast.n1.MainMapRuntimeTest

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FAST-N1-stable-android
          path: |
            ${{ env.FAST_APK_NAME }}
            ${{ env.FAST_APK_NAME }}.sha256
          retention-days: 30

      - name: Publish official FAST download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES="FAST N°1 Android ${FAST_VERSION_NAME}. APK complète non minifiée, identité permanente cg.fast.n1.mobile, signature FAST permanente, installation propre Android 6/8/15 et mise à jour signée validées."
          if gh release view "$FAST_RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$FAST_RELEASE_TAG" "$FAST_APK_NAME" "${FAST_APK_NAME}.sha256" --clobber
            gh release edit "$FAST_RELEASE_TAG" --notes "$NOTES"
          else
            gh release create "$FAST_RELEASE_TAG" "$FAST_APK_NAME" "${FAST_APK_NAME}.sha256" --title "FAST N°1 Android — ${FAST_VERSION_NAME}" --notes "$NOTES"
          fi

      - name: Point official FAST site to this APK
        shell: bash
        run: |
          set -euo pipefail
          export FAST_SOURCE_APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${FAST_RELEASE_TAG}/${FAST_APK_NAME}"
          python3 - <<'PY'
          import json, os
          path='updates/latest.json'
          with open(path, encoding='utf-8') as f: data=json.load(f)
          data.update({
            'version': os.environ['FAST_VERSION_NAME'],
            'build': int(os.environ['FAST_VERSION_CODE']),
            'sourceApkUrl': os.environ['FAST_SOURCE_APK_URL'],
            'fileName': os.environ['FAST_APK_NAME'],
            'platform': 'Android',
            'url': 'https://fast-n1-officiel.vercel.app/#download',
            'apkUrl': 'https://fast-n1-officiel.vercel.app/api/download',
            'notes': f"FAST N°1 {os.environ['FAST_VERSION_NAME']} — carte chauffeur Google Maps native validée sur Android 35."
          })
          with open(path,'w',encoding='utf-8') as f:
            json.dump(data,f,ensure_ascii=False,indent=2); f.write('\n')
          PY
          git config user.name 'FAST Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add updates/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update official FAST APK to ${FAST_VERSION_NAME}"
            git push origin HEAD:main
          fi
