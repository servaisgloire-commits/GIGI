name: Build FAST Android 11.09.2026

on:
  push:
    branches: [ main, fast-android-11092026 ]
    paths:
      - 'app/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FAST_GOOGLE_MAPS_API_KEY: ${{ secrets.FAST_GOOGLE_MAPS_API_KEY }}
      FAST_SUPABASE_URL: https://hmwxwzfcpdvgzjgxruup.supabase.co
      FAST_SUPABASE_PUBLISHABLE_KEY: sb_publishable_RYYcI3j1QU9LAUa-0s1eZQ_x6HpDr38
      FAST_PYTHON_API_URL: https://fast-n1-python-api.vercel.app
      FAST_KEYSTORE_B64: ${{ secrets.FAST_KEYSTORE_B64 }}
      FAST_KEYSTORE_PASSWORD: ${{ secrets.FAST_KEYSTORE_PASSWORD }}
      FAST_KEY_ALIAS: ${{ secrets.FAST_KEY_ALIAS }}
      FAST_KEY_PASSWORD: ${{ secrets.FAST_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare FAST signing
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FAST_KEYSTORE_B64:-}" ] && [ -n "${FAST_KEYSTORE_PASSWORD:-}" ] && [ -n "${FAST_KEY_ALIAS:-}" ] && [ -n "${FAST_KEY_PASSWORD:-}" ]; then
            KEYSTORE="$RUNNER_TEMP/fast-production.jks"
            printf '%s' "$FAST_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
            test -s "$KEYSTORE"
            keytool -list -keystore "$KEYSTORE" -storepass "$FAST_KEYSTORE_PASSWORD" -alias "$FAST_KEY_ALIAS" >/dev/null
            echo "FAST_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
            echo "FAST_UPDATE_SIGNING=production" >> "$GITHUB_ENV"
            echo "Stable FAST production signing enabled."
          else
            echo "FAST_UPDATE_SIGNING=debug-preview" >> "$GITHUB_ENV"
            echo "::warning::FAST production keystore is not configured. Building a preview APK for direct testing; Play Protect may warn until the stable FAST production key is configured."
          fi

      - name: Check JavaScript syntax
        run: |
          for f in app/src/main/assets/*.js; do node --check "$f"; done

      - name: Verify backend and Supabase connectivity
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 3 --retry-delay 2 \
            "$FAST_PYTHON_API_URL/health" | tee /tmp/fast-health.json
          grep -q '"ok"' /tmp/fast-health.json
          curl --fail --show-error --silent --retry 3 --retry-delay 2 \
            -H "apikey: $FAST_SUPABASE_PUBLISHABLE_KEY" \
            "$FAST_SUPABASE_URL/auth/v1/settings" >/tmp/fast-supabase-settings.json
          test -s /tmp/fast-supabase-settings.json

      - name: Verify FAST Android product configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationId = "cg.fast.n1.v11092026"' app/build.gradle.kts
          grep -q 'versionName = "11.09.2026"' app/build.gradle.kts
          grep -q 'versionCode = 11092026' app/build.gradle.kts
          grep -q 'applicationIdSuffix = ".install11092026"' app/build.gradle.kts
          grep -q 'signingConfigs.findByName("production")' app/build.gradle.kts
          grep -q 'android:label="FAST N°1"' app/src/main/AndroidManifest.xml
          grep -q 'android:icon="@drawable/fast_logo"' app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@drawable/fast_logo"' app/src/main/AndroidManifest.xml
          grep -q 'WebViewAssetLoader' app/src/main/java/cg/fast/n1/MainActivity.kt
          grep -q 'supabaseUrl(): String = BuildConfig.SUPABASE_URL' app/src/main/java/cg/fast/n1/MainActivity.kt
          grep -q 'pythonApiUrl(): String = BuildConfig.PYTHON_API_URL' app/src/main/java/cg/fast/n1/MainActivity.kt
          grep -q 'googleMapsApiKey(): String = BuildConfig.GOOGLE_MAPS_API_KEY' app/src/main/java/cg/fast/n1/MainActivity.kt
          grep -q 'allowFileAccess = false' app/src/main/java/cg/fast/n1/MainActivity.kt
          grep -q 'allowContentAccess = false' app/src/main/java/cg/fast/n1/MainActivity.kt
          grep -q 'web.destroy()' app/src/main/java/cg/fast/n1/MainActivity.kt
          if grep -q 'REQUEST_INSTALL_PACKAGES' app/src/main/AndroidManifest.xml; then echo 'Unexpected APK install permission'; exit 1; fi
          if grep -q 'allowUniversalAccessFromFileURLs = true' app/src/main/java/cg/fast/n1/MainActivity.kt; then echo 'Unsafe WebView setting'; exit 1; fi
          grep -q '#fastSavedPlaces,.fast-saved-wrap,.fast-quick-destinations,.fast-saved-place-sheet{display:none!important}' app/src/main/assets/production-ui.css
          grep -q 'removeLegacySavedDestinations' app/src/main/assets/production-ui.js
          if grep -q "data-fast-place=\"home\"" app/src/main/assets/production-ui.js; then echo 'Visible quick destination controls reintroduced'; exit 1; fi

      - name: Build clean directly installable APK
        run: |
          gradle clean assembleDirectInstall

      - name: Verify APK metadata and signature
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/directInstall/app-directInstall.apk'
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | tee /tmp/fast-badging.txt
          grep -q "package: name='cg.fast.n1.v11092026.install11092026'" /tmp/fast-badging.txt
          grep -q "versionCode='11092026'" /tmp/fast-badging.txt
          grep -q "versionName='11.09.2026-android'" /tmp/fast-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/fast-signature.txt
          grep -q 'Verifies' /tmp/fast-signature.txt
          if grep -qi 'CN=Android Debug' /tmp/fast-signature.txt; then
            echo "::warning::Preview APK uses Android Debug certificate. Installation can be tested, but stable production signing is still required for trusted in-place updates."
          fi
          grep 'Signer: certificate SHA-256 digest' /tmp/fast-signature.txt || true
          echo "Signing mode: ${FAST_UPDATE_SIGNING:-unknown}"

      - name: Install and launch APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          disable-animations: false
          script: |
            adb install app/build/outputs/apk/directInstall/app-directInstall.apk
            adb shell pm list packages | grep 'package:cg.fast.n1.v11092026.install11092026'
            adb shell am start -W -n cg.fast.n1.v11092026.install11092026/cg.fast.n1.MainActivity || true
            sleep 5
            adb shell dumpsys activity activities | grep 'cg.fast.n1.v11092026.install11092026'

      - name: Prepare final APK
        run: |
          cp app/build/outputs/apk/directInstall/app-directInstall.apk FAST-N1-11-09-2026-ANDROID.apk
          sha256sum FAST-N1-11-09-2026-ANDROID.apk | tee FAST-N1-11-09-2026-ANDROID.sha256

      - name: Upload verified Android APK
        uses: actions/upload-artifact@v4
        with:
          name: FAST-N1-11-09-2026-android
          path: |
            FAST-N1-11-09-2026-ANDROID.apk
            FAST-N1-11-09-2026-ANDROID.sha256
          retention-days: 30

      - name: Publish Android direct-download release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='fast-n1-11-09-2026'
          ASSET='FAST-N1-11-09-2026-ANDROID.apk'
          SUM='FAST-N1-11-09-2026-ANDROID.sha256'
          if [ "${FAST_UPDATE_SIGNING:-}" = "production" ]; then
            NOTES='APK FAST N°1 signée avec la clé de production stable et vérifiée avant publication.'
          else
            NOTES='APK FAST N°1 de prévisualisation directe. Interface corrigée et testée sur Android 35. Une signature FAST de production stable reste nécessaire pour supprimer les avertissements Play Protect et garantir les mises à jour par-dessus les versions précédentes.'
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "$ASSET" "$SUM" --title 'FAST N°1 Android — 11/09/2026' --notes "$NOTES"
          else
            gh release upload "$TAG" "$ASSET" "$SUM" --clobber
          fi

          LEGACY_TAG='fast-android-v6.0.3-build617'
          LEGACY_ASSET='FAST-N1-v6.0.3-build617-ANDROID.apk'
          cp "$ASSET" "$LEGACY_ASSET"
          if gh release view "$LEGACY_TAG" >/dev/null 2>&1; then
            gh release upload "$LEGACY_TAG" "$LEGACY_ASSET" --clobber
          fi
