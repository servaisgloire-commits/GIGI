name: Build FAST Android

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FAST_GOOGLE_MAPS_API_KEY: ${{ secrets.FAST_GOOGLE_MAPS_API_KEY }}
      FAST_KEYSTORE_BASE64: ${{ secrets.FAST_KEYSTORE_BASE64 }}
      FAST_KEYSTORE_PASSWORD: ${{ secrets.FAST_KEYSTORE_PASSWORD }}
      FAST_KEY_ALIAS: ${{ secrets.FAST_KEY_ALIAS }}
      FAST_KEY_PASSWORD: ${{ secrets.FAST_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check JavaScript syntax
        run: |
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/google-map-adapter.js
          node --check app/src/main/assets/app-quality.js
          node --check app/src/main/assets/competitive-235.js
          node --check app/src/main/assets/driver-profile.js
          node --check app/src/main/assets/fast-security.js
          node --check app/src/main/assets/stability-fixes.js
          node --check app/src/main/assets/driver-gps.js
          node --check app/src/main/assets/driver-motion.js
          node --check app/src/main/assets/production-ui.js
      - name: Verify production presentation
        run: |
          if grep -RniE 'unpkg.com/maplibre|maplibre-gl.css|maplibre-gl.js|maplibregl' app/src/main/assets; then echo 'MapLibre runtime reference found'; exit 1; fi
          grep -q 'versionName = "5.13"' app/build.gradle.kts
          grep -q "production-ui.css" app/src/main/java/cg/fast/n1/MainActivity.kt
          grep -q "production-ui.js" app/src/main/java/cg/fast/n1/MainActivity.kt
          grep -q "currentDriverPage='home'" app/src/main/assets/driver-profile.js
          grep -q "activateDriverHome(false)" app/src/main/assets/driver-profile.js
          test -f app/src/main/assets/production-ui.js
          test -f app/src/main/assets/production-ui.css
          test -f app/src/main/assets/driver-profile.js
      - name: Build verification APK
        run: gradle assembleDebug
      - name: Decode production keystore
        if: ${{ env.FAST_KEYSTORE_BASE64 != '' && github.event_name != 'pull_request' }}
        run: |
          echo "$FAST_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fast-production.jks"
          echo "FAST_KEYSTORE_PATH=$RUNNER_TEMP/fast-production.jks" >> "$GITHUB_ENV"
      - name: Build production release
        if: ${{ env.FAST_KEYSTORE_BASE64 != '' && github.event_name != 'pull_request' }}
        run: gradle assembleRelease
      - name: Upload verification APK
        uses: actions/upload-artifact@v4
        with:
          name: FAST-N1-v5.13-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Upload signed production APK
        if: ${{ env.FAST_KEYSTORE_BASE64 != '' && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: FAST-N1-v5.13-production
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90
      - name: Publish signed production release
        if: ${{ env.FAST_KEYSTORE_BASE64 != '' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fast-v5.13"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "FAST N°1 v5.13" --notes "FAST v5.13: capacity hardening, geospatial dispatch, reduced network load, auth/recovery fixes and stability improvements."
          cp app/build/outputs/apk/release/app-release.apk FAST-N1-v5.13-production.apk
          gh release upload "$TAG" FAST-N1-v5.13-production.apk --clobber
