name: Build FAST Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FAST_MAPBOX_PUBLIC_TOKEN: ${{ secrets.FAST_MAPBOX_PUBLIC_TOKEN }}
      FAST_KEYSTORE_BASE64: ${{ secrets.FAST_KEYSTORE_BASE64 }}
      FAST_KEYSTORE_PASSWORD: ${{ secrets.FAST_KEYSTORE_PASSWORD }}
      FAST_KEY_ALIAS: ${{ secrets.FAST_KEY_ALIAS }}
      FAST_KEY_PASSWORD: ${{ secrets.FAST_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build verification APK
        run: gradle assembleDebug

      - name: Decode production keystore
        if: ${{ env.FAST_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$FAST_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fast-production.jks"
          echo "FAST_KEYSTORE_PATH=$RUNNER_TEMP/fast-production.jks" >> "$GITHUB_ENV"

      - name: Build production release
        if: ${{ env.FAST_KEYSTORE_BASE64 != '' }}
        run: gradle assembleRelease

      - name: Upload verification APK
        uses: actions/upload-artifact@v4
        with:
          name: FAST-N1-v0.7.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload signed production APK
        if: ${{ env.FAST_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: FAST-N1-v0.7.0-production
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: Publish signed production release
        if: ${{ env.FAST_KEYSTORE_BASE64 != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fast-v0.7.0"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "FAST N°1 v0.7.0" --notes "Premium driver UI, confirmed addresses, ride safety PIN, SOS and improved authentication email flows."
          cp app/build/outputs/apk/release/app-release.apk FAST-N1-v0.7.0-production.apk
          gh release upload "$TAG" FAST-N1-v0.7.0-production.apk --clobber
