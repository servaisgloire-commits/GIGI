name: FAST Driver Preproduction Audit

on:
  push:
    branches: [ audit-driver-flow-concurrency-20260913 ]
  pull_request:
    branches: [ main ]

concurrency:
  group: fast-driver-preproduction-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  driver-flow-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest
      - name: Compile backend
        run: python -m compileall -q backend/app
      - name: Run backend tests
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: python -m pytest -q backend/tests
      - name: Audit multi-client and multi-driver backend guards
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'drivers_claimed_by_concurrent_requests' backend/app/flex_main.py
          grep -q 'existing_atomic_offer' backend/app/flex_main.py
          grep -q '_is_unique_conflict' backend/app/flex_main.py
          grep -q 'nearest_same_country_atomic_claim' backend/app/flex_main.py
          grep -q 'same_country_only' backend/app/flex_main.py
          grep -q 'pickup_confirmed' backend/app/vehicle_main.py
          grep -q 'destination_confirmed' backend/app/vehicle_main.py
          grep -q 'cancellation_reason' backend/app/vehicle_main.py
          grep -q 'cash_received' backend/app/vehicle_main.py
          grep -q '_optional_data' backend/app/vehicle_main.py
          grep -q 'Driver action required' backend/app/vehicle_main.py
          grep -q 'expected_current_status' backend/app/vehicle_main.py
      - name: Install JS audit dependencies
        run: npm install --no-save --ignore-scripts jsdom@26.1.0
      - name: Validate all application JavaScript
        run: |
          set -euo pipefail
          for f in app/src/main/assets/*.js; do node --check "$f"; done
      - name: Test full registration to completed ride contract
        run: node tests/full-ride-flow-contract.mjs
      - name: Test driver map visible rebuild
        run: node tests/driver-map-smoke.mjs
      - name: Test passenger regression
        run: node tests/client-rebuild-smoke.mjs
      - name: Test driver restart after verified PIN
        run: node tests/driver-restart-pin-smoke.mjs
      - name: Test app close cancels searching ride safely
        run: node tests/app-close-search-smoke.mjs
      - name: Verify recovery loaders
        run: |
          grep -q 'driver-map-recovery.js' app/src/main/assets/signup-ui-cleanup.js
          grep -q 'driver-restart-state.js' app/src/main/assets/signup-ui-cleanup.js
          grep -q 'app-close-guard.js' app/src/main/assets/signup-ui-cleanup.js
          grep -q 'FASTDriverMapAudit' app/src/main/assets/driver-map-recovery.js
          grep -q 'FASTRestartRecovery' app/src/main/assets/driver-restart-state.js
          grep -q 'FASTAppCloseGuard' app/src/main/assets/app-close-guard.js
          grep -q 'cancelSearchingRideOnClose' app/src/main/java/cg/fast/n1/MainActivity.kt

  controlled-10k-production-load-audit:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[10k-load]')
    needs: driver-flow-audit
    runs-on: ubuntu-latest
    steps:
      - name: Run 10000 read-only production requests
        env:
          FAST_API: https://fast-n1-python-api.vercel.app
        run: |
          python - <<'PY'
          import concurrent.futures, json, os, statistics, time, urllib.request

          base=os.environ['FAST_API'].rstrip('/')
          total=10000
          workers=100
          urls=[base + ('/v1/config' if i % 5 == 0 else '/health') for i in range(total)]

          def hit(url):
              start=time.perf_counter()
              try:
                  req=urllib.request.Request(url,headers={
                      'User-Agent':'FAST-preproduction-load-audit/1.0',
                      'Cache-Control':'no-cache'
                  })
                  with urllib.request.urlopen(req,timeout=15) as r:
                      r.read(256)
                      return 200 <= r.status < 300,r.status,time.perf_counter()-start,''
              except Exception as e:
                  return False,0,time.perf_counter()-start,str(e)[:160]

          started=time.perf_counter()
          with concurrent.futures.ThreadPoolExecutor(max_workers=workers) as ex:
              results=list(ex.map(hit,urls))
          elapsed=time.perf_counter()-started
          ok=[r for r in results if r[0]]
          bad=[r for r in results if not r[0]]
          lat=sorted(r[2] for r in results)
          def pct(p):
              return lat[max(0,min(len(lat)-1,int(len(lat)*p)-1))]
          report={
              'requests':total,
              'max_parallel_requests':workers,
              'success':len(ok),
              'errors':len(bad),
              'success_rate':round(len(ok)/total*100,2),
              'elapsed_s':round(elapsed,2),
              'requests_per_second':round(total/elapsed,2),
              'p50_s':round(statistics.median(lat),3),
              'p95_s':round(pct(.95),3),
              'p99_s':round(pct(.99),3),
              'sample_errors':[{'status':r[1],'detail':r[3]} for r in bad[:10]],
          }
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if report['success_rate'] < 99.0:
              raise SystemExit('FAST 10k load audit failed: success rate below 99%')
          if report['p95_s'] > 5:
              raise SystemExit('FAST 10k load audit failed: p95 above 5 seconds')
          PY
