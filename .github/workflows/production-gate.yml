name: FAST Production Gate
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt pytest
      - run: python -m compileall -q backend/app
      - run: python -m pytest -q backend/tests
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
  android-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate clean FAST 09.10.2026.1 Android source
        shell: bash
        run: |
          set -euo pipefail
          for f in app/src/main/assets/*.js; do node --check "$f"; done
          grep -q 'applicationId = "cg.fast.n1.mobile"' app/build.gradle.kts
          grep -q 'versionName = "09.10.2026.1"' app/build.gradle.kts
          grep -q 'versionCode = 25092033' app/build.gradle.kts
          node tests/address-search-regression.mjs
          node tests/autofill-regression.mjs
          node tests/back-navigation-regression.mjs
          node tests/booking-regression.mjs
          node tests/session-touch-navigation-notification-regression.mjs
          grep -q 'android:label="FAST N°1"' app/src/main/AndroidManifest.xml
          grep -q 'WebViewAssetLoader' app/src/main/java/cg/fast/n1/MainActivity.kt
          grep -R -q '/v1/auth/password' app/src/main/assets/*.js
          grep -R -q '/v1/auth/signup' app/src/main/assets/*.js
          grep -R -q '/v1/places/autocomplete?q=' app/src/main/assets/*.js
          grep -R -q 'pickup_address' app/src/main/assets/*.js
          grep -R -q 'destination_address' app/src/main/assets/*.js
          grep -R -q 'driver_arriving' app/src/main/assets/*.js
          grep -R -q 'in_progress' app/src/main/assets/*.js
          grep -R -q '/v1/rides' app/src/main/assets/*.js
          grep -R -q 'issue_ride_pin' app/src/main/assets/*.js
          grep -R -q 'verify_ride_pin' app/src/main/assets/*.js
          grep -R -q '/v1/driver/vehicle' app/src/main/assets/*.js
          grep -q 'https://www.google.com/maps?output=embed' app/src/main/assets/fast-simplified.js
          cmp app/src/main/assets/fast-logo.svg admin/site/fast-logo.svg
          ! grep -qi 'leaflet' app/src/main/assets/index.html
          ! grep -qi 'openstreetmap' app/src/main/assets/index.html
          ! grep -q 'data-type="comfort"' app/src/main/assets/index.html
          ! grep -q 'data-type="xl"' app/src/main/assets/index.html
          ! grep -q '>Comfort<' app/src/main/assets/index.html
          ! grep -q '>XL<' app/src/main/assets/index.html
          if grep -RniE 'prototype|coming soon|lorem ipsum' app/src/main/assets; then exit 1; fi
          if grep -q 'REQUEST_INSTALL_PACKAGES' app/src/main/AndroidManifest.xml; then exit 1; fi
      - name: Compile clean Android app
        run: gradle assembleDebug

  public-web-readonly-smoke:
    name: FAST web and API GET-only smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Confirm FAST web and API respond
        shell: bash
        run: |
          set -euo pipefail
          for url in 'https://fast-n1-officiel.vercel.app' 'https://fast-n1-python-api.vercel.app/health'; do
            http_code="$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 25 "$url")"
            echo "FAST GET-only check $url: HTTP $http_code"
            if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 400 ]; then exit 1; fi
          done

  agent-source-integrity:
    name: FAST APK, backend, and public site source inventory
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Read-only source inventory
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/java/cg/fast/n1/MainActivity.kt
          test -s app/src/main/AndroidManifest.xml
          test -s backend/app/main.py
          test -s admin/index.html
          test -s app/build.gradle.kts
          echo "FAST audit source SHA: $(git rev-parse HEAD)"
          echo 'No GitHub/Vercel/Supabase secrets are used or printed.'
