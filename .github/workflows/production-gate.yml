name: FAST Production Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest
      - name: Compile Python
        run: python -m compileall -q backend/app
      - name: Run backend tests
        run: python -m pytest -q backend/tests
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
      - name: Validate FAST backend routing
        run: |
          test -f backend/app/global_main.py
          test -f backend/app/flex_main.py
          grep -q 'fast_global_available_drivers' backend/app/global_main.py
          grep -q 'same_country_only' backend/app/global_main.py
          grep -q 'proposed_price' backend/app/flex_main.py
          grep -q 'pricing_mode' backend/app/flex_main.py
          grep -q 'app/flex_main.py' backend/vercel.json
      - name: Reject committed server secrets
        shell: bash
        run: |
          if git grep -nE 'sb_secret_[A-Za-z0-9_-]+' -- ':!*.md'; then
            echo 'Supabase secret key found in repository'; exit 1
          fi

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate Android source and branding
        shell: bash
        run: |
          set -euo pipefail
          for f in app/src/main/assets/*.js; do node --check "$f"; done
          grep -q 'applicationId = "cg.fast.n1.v11092026"' app/build.gradle.kts
          grep -q 'versionName = "11.09.2026"' app/build.gradle.kts
          grep -q 'versionCode = 11092026' app/build.gradle.kts
          grep -q 'applicationIdSuffix = ".install11092026"' app/build.gradle.kts
          grep -q '"build": 11092026' updates/latest.json
          grep -q 'fast-n1-11-09-2026' updates/latest.json
          test -s app/src/main/assets/fast-logo.svg
          grep -q 'android:label="FAST N°1"' app/src/main/AndroidManifest.xml
          grep -q 'android:icon="@drawable/fast_logo"' app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@drawable/fast_logo"' app/src/main/AndroidManifest.xml
          grep -q 'WebViewAssetLoader' app/src/main/java/cg/fast/n1/MainActivity.kt
          grep -q 'appassets.androidplatform.net/assets/index.html' app/src/main/java/cg/fast/n1/MainActivity.kt
          grep -q 'allowFileAccess = false' app/src/main/java/cg/fast/n1/MainActivity.kt
          grep -q 'allowContentAccess = false' app/src/main/java/cg/fast/n1/MainActivity.kt
          grep -q '__fast_storage_probe__' app/src/main/assets/google-map-adapter.js
          grep -q 'fast-map-fallback' app/src/main/assets/google-map-adapter.js
          grep -q 'getElement(){return this.el' app/src/main/assets/google-map-adapter.js
          grep -q 'const liveMap=' app/src/main/assets/driver-motion.js
          grep -q 'const liveMarker=' app/src/main/assets/driver-motion.js
          if grep -RniE 'unpkg.com/maplibre|maplibre-gl.css|maplibre-gl.js|maplibregl' app/src/main/assets; then echo 'MapLibre runtime reference found'; exit 1; fi
          if grep -q 'REQUEST_INSTALL_PACKAGES' app/src/main/AndroidManifest.xml; then echo 'Unknown APK install permission must not be present'; exit 1; fi
      - name: Build isolated installable APK
        run: gradle assembleDirectInstall
      - name: Build production release package
        run: gradle assembleRelease
      - name: Verify Android package and signature
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/directInstall/app-directInstall.apk'
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | tee /tmp/fast-badging.txt
          grep -q "package: name='cg.fast.n1.v11092026.install11092026'" /tmp/fast-badging.txt
          grep -q "versionCode='11092026'" /tmp/fast-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/fast-signature.txt
          grep -q 'Verifies' /tmp/fast-signature.txt
      - name: Upload production-gate APK
        uses: actions/upload-artifact@v4
        with:
          name: FAST-production-gate-11-09-2026-android
          path: app/build/outputs/apk/directInstall/app-directInstall.apk
          retention-days: 14
