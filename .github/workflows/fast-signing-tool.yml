name: FAST Signing Tool

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fast-signing-tool.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified APK signer
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar \
            -o uber-apk-signer-1.3.0.jar
          echo 'e1299fd6fcf4da527dd53735b56127e8ea922a321128123b9c32d619bba1d835  uber-apk-signer-1.3.0.jar' | sha256sum -c -
      - name: Upload signing tool
        uses: actions/upload-artifact@v4
        with:
          name: FAST-apksigner-tool
          path: uber-apk-signer-1.3.0.jar
          retention-days: 1
