name: FAST Web QA and Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'admin/site/**'
      - '.github/workflows/fast-web-qa-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-qa:
    name: Vérifier site officiel FAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Vérifier site commercial FAST
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          public = Path('admin/site/index.html').read_text(encoding='utf-8')
          for section in ['features','security','how','download']:
              assert f'id="{section}"' in public, f'Section commerciale absente: {section}'
              assert f'href="#{section}"' in public, f'Lien commercial absent: {section}'
          assert 'FAST N°1 • Votre trajet, simplement' in public
          assert 'Télécharger FAST N°1' in public
          assert 'href="/api/download"' in public
          assert public.count('fast-logo.svg') >= 4
          assert Path('admin/site/fast-logo.svg').is_file()
          assert 'fast-v0.5.0' not in public
          lower_public = public.lower()
          forbidden_public = ['prototype','pré-dev','pre-dev','preview','beta','bêta','lorem ipsum','site en développement']
          hits = [token for token in forbidden_public if token in lower_public]
          assert not hits, 'Signaux de brouillon visibles: ' + ', '.join(hits)
          print('OK: site officiel commercial FAST contrôlé')
          PY

  deploy-vercel:
    name: Publier site officiel FAST
    needs: web-qa
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Détecter l'autorisation Vercel
        id: vercel
        shell: bash
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::warning::VERCEL_TOKEN absent. QA terminée, déploiement ignoré.'
          fi
      - uses: actions/setup-node@v5
        if: steps.vercel.outputs.available == 'true'
        with:
          node-version: '22'
      - name: Installer Vercel CLI
        if: steps.vercel.outputs.available == 'true'
        run: npm install --global vercel@latest
      - name: Publier le site officiel FAST
        if: steps.vercel.outputs.available == 'true'
        shell: bash
        run: |
          mkdir -p admin/site/.vercel
          printf '%s\n' '{"orgId":"team_ikooiav5lkWrGTZIY05wYg0n","projectId":"prj_nuvIyl2pAuinnsTSRUktMbMyMU9j"}' > admin/site/.vercel/project.json
          vercel deploy --prod --yes --force --token "$VERCEL_TOKEN" --cwd admin/site
      - name: Vérifier le site officiel
        if: steps.vercel.outputs.available == 'true'
        shell: bash
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            PUBLIC="$(curl -fsSL -H 'Cache-Control: no-cache' "https://fast-n1-officiel.vercel.app/?qa=$(date +%s)" || true)"
            if grep -q 'FAST N°1 • Votre trajet, simplement' <<<"$PUBLIC" && \
               grep -q 'Télécharger FAST N°1' <<<"$PUBLIC" && \
               grep -q 'href="/api/download"' <<<"$PUBLIC"; then
              echo 'OK: site commercial FAST publié.'
              exit 0
            fi
            sleep 5
          done
          echo 'Le domaine Vercel ne sert pas encore le site commercial FAST.'
          exit 1
