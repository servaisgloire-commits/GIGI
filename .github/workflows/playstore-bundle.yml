name: FAST Play Store Bundle

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/playstore-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate FAST release identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationId = "cg.fast.n1.v11092026"' app/build.gradle.kts
          grep -q 'versionName = "11.09.2026"' app/build.gradle.kts
          grep -q 'versionCode = 11092026' app/build.gradle.kts
          test -s app/src/main/assets/fast-logo.svg
          grep -q 'ensureOfficialBranding' app/src/main/assets/production-ui.js
          grep -q 'android:label="FAST N°1"' app/src/main/AndroidManifest.xml
      - name: Build unsigned Play Store bundle
        run: gradle bundleRelease
      - name: Verify AAB exists
        run: test -s app/build/outputs/bundle/release/app-release.aab
      - name: Upload unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: FAST-N1-11-09-2026-build11092026-unsigned-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
