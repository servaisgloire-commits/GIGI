name: FAST Play Store Bundle

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/playstore-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate FAST release identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationId = "cg.fast.n1"' app/build.gradle.kts
          VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -1)"
          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts | head -1)"
          test -n "$VERSION_NAME"
          test "$VERSION_CODE" -gt 0
          echo "FAST_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "FAST_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          test -s app/src/main/assets/fast-logo.svg
          grep -q 'android:label="FAST N°1"' app/src/main/AndroidManifest.xml
      - name: Build unsigned Play Store bundle
        run: gradle bundleRelease
      - name: Verify AAB exists
        run: test -s app/build/outputs/bundle/release/app-release.aab
      - name: Upload unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: FAST-N1-${{ env.FAST_VERSION_NAME }}-build${{ env.FAST_VERSION_CODE }}-unsigned-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
