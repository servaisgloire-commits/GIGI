name: FAST Client Address QA

on:
  push:
    branches:
      - fix/client-address-flow-20260912
    paths:
      - 'app/**'
      - '.github/workflows/client-address-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client-address-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate every application JavaScript file
        shell: bash
        run: |
          set -euo pipefail
          for f in app/src/main/assets/*.js; do
            node --check "$f"
          done

      - name: Verify client address flow contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          touch = Path('app/src/main/assets/touch-fix.js').read_text(encoding='utf-8')
          repair = Path('app/src/main/assets/ride-flow-repair.js').read_text(encoding='utf-8')
          index = Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          assert 'Touchez une 2e fois' not in touch
          assert 'Un clic simple ne valide JAMAIS' not in touch
          assert 'Appuyez une fois pour sélectionner' in touch
          assert "input.dataset.fastFlowRepair='1'" in touch
          assert "b.textContent='Commander un FAST'" in touch
          assert "fast:address-confirmed" in touch
          assert 'touch-fix.js' in index and 'ride-flow-repair.js' in index
          assert index.index('touch-fix.js') < index.index('ride-flow-repair.js')
          assert 'Code PIN FAST' in repair
          assert 'showRatingSheet' in repair
          assert 'syncDriverArrival' in repair
          assert 'fast:ride-cancelled' in repair
          print('OK: one-tap address flow and required ride features are present')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build isolated debug APK
        run: gradle clean assembleDebug

      - name: Verify debug APK exists
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Install and launch on Android 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm list packages | grep 'package:cg.fast.n1.v11092026.debug'
            adb shell am start -W -n cg.fast.n1.v11092026.debug/cg.fast.n1.MainActivity
            sleep 5
            adb shell dumpsys activity activities | grep 'cg.fast.n1.v11092026.debug'
