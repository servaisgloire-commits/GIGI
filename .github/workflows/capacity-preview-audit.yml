name: FAST Capacity Preview Audit

on:
  push:
    branches: [ agent-g-server-capacity-20260924 ]
    paths:
      - 'backend/**'
      - '.github/workflows/capacity-preview-audit.yml'
      - 'audits/capacity-preview-retest.txt'

permissions:
  contents: read

jobs:
  preview-10k:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_ikooiav5lkWrGTZIY05wYg0n
      VERCEL_PROJECT_ID: prj_fFq7tf0gmVRerxi1bYNzloFh8L1l
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install and test backend
        run: |
          pip install -q -r backend/requirements.txt pytest
          PYTHONPATH="$GITHUB_WORKSPACE/backend" python -m pytest -q backend/tests
          python -m compileall -q backend/app backend/api

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link FAST API preview
        run: |
          test -n "$VERCEL_TOKEN"
          mkdir -p backend/.vercel
          printf '%s\n' "{\"orgId\":\"$VERCEL_ORG_ID\",\"projectId\":\"$VERCEL_PROJECT_ID\"}" > backend/.vercel/project.json

      - name: Deploy optimized preview
        id: deploy
        run: |
          URL="$(vercel deploy --yes --token "$VERCEL_TOKEN" --cwd backend)"
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"
          echo "FAST optimized preview: $URL"

      - name: Verify preview health
        run: |
          URL='${{ steps.deploy.outputs.preview_url }}'
          for i in 1 2 3 4 5 6; do
            if curl -fsSL "$URL/health" | grep -q '"ok"'; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Run 10000 short-connection requests against optimized preview
        env:
          FAST_API: ${{ steps.deploy.outputs.preview_url }}
        run: |
          python - <<'PY'
          import concurrent.futures, json, os, statistics, time, urllib.request
          base=os.environ['FAST_API'].rstrip('/')
          total=10000
          workers=100
          urls=[base + ('/v1/config' if i % 5 == 0 else '/health') for i in range(total)]

          def hit(url):
              start=time.perf_counter()
              try:
                  req=urllib.request.Request(url,headers={
                      'User-Agent':'FAST-capacity-preview-audit/1.0',
                      'Connection':'close'
                  })
                  with urllib.request.urlopen(req,timeout=15) as r:
                      r.read(256)
                      return 200 <= r.status < 300,r.status,time.perf_counter()-start,''
              except Exception as e:
                  return False,0,time.perf_counter()-start,str(e)[:160]

          started=time.perf_counter()
          with concurrent.futures.ThreadPoolExecutor(max_workers=workers) as ex:
              results=list(ex.map(hit,urls))
          elapsed=time.perf_counter()-started
          ok=[r for r in results if r[0]]
          bad=[r for r in results if not r[0]]
          lat=sorted(r[2] for r in results)
          def pct(p): return lat[max(0,min(len(lat)-1,int(len(lat)*p)-1))]
          report={
              'target':'optimized_preview',
              'requests':total,
              'max_parallel_requests':workers,
              'connection_model':'short connections',
              'success':len(ok),
              'errors':len(bad),
              'success_rate':round(len(ok)/total*100,2),
              'elapsed_s':round(elapsed,2),
              'requests_per_second':round(total/elapsed,2),
              'p50_s':round(statistics.median(lat),3),
              'p95_s':round(pct(.95),3),
              'p99_s':round(pct(.99),3),
              'sample_errors':[{'status':r[1],'detail':r[3]} for r in bad[:10]],
          }
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if report['success_rate'] < 99.0:
              raise SystemExit('FAST optimized preview 10k audit failed: success rate below 99%')
          if report['p95_s'] > 5:
              raise SystemExit('FAST optimized preview 10k audit failed: p95 above 5 seconds')
          PY
