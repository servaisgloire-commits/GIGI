name: FAST Connect APK quick verified bundle
on:
  push:
    branches: [fast-connect-quickcheck-20261016]
    paths:
      - '.github/workflows/fast-connect-apk-quickcheck.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-tested-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Test FAST Connect website and Supabase reachability
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors --max-time 25 'https://fast-n1-connect.vercel.app/' -o /tmp/fast-connect.html
          grep -qi 'FAST Connect' /tmp/fast-connect.html
          http="$(curl -sS -o /dev/null --retry 3 --retry-all-errors --max-time 25 -w '%{http_code}' 'https://hmwxwzfcpdvgzjgxruup.supabase.co/auth/v1/health')"
          case "$http" in 200|401|403) echo "Supabase Auth endpoint reachable: HTTP $http";; *) echo "::error::Supabase HTTP $http"; exit 1;; esac
      - name: Compile signed test APK
        working-directory: fast-connect-android
        run: gradle --no-daemon :app:assembleDebug
      - name: Inspect real Android artifact
        shell: bash
        run: |
          set -euo pipefail
          apk=fast-connect-android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          sign="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$sign" verify --verbose --print-certs "$apk" | head -12
          "$aapt" dump badging "$apk" | grep '^package:' | tee /tmp/connect-package.txt
          grep -q "name='com.fastn1.connect'" /tmp/connect-package.txt
          grep -q "versionCode='2'" /tmp/connect-package.txt
          grep -q "versionName='1.1.0-test'" /tmp/connect-package.txt
          sha256sum "$apk"
      - uses: actions/upload-artifact@v4
        with:
          name: FAST-Connect-1.1-Verified-Build
          path: fast-connect-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
