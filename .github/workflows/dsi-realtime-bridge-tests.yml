name: DSI realtime bridge safety

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/202610181900_dsi_realtime_bridge.sql'
      - 'supabase/migrations/202610181901_dsi_reopen_history.sql'
      - 'tests/test_dsi_realtime.py'
      - '.github/workflows/dsi-realtime-bridge-tests.yml'
  push:
    branches: [dsi-realtime-groq-20261018]

permissions:
  contents: read

jobs:
  validate-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile bridge checks
        run: python -m py_compile tests/test_dsi_realtime.py
      - name: Validate realtime dispatch and history constraints
        run: python -m unittest discover -s tests -p test_dsi_realtime.py -v
