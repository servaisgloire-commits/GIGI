name: DSI RLS Performance Regression
on:
  pull_request:
    branches: [main]
  push:
    branches: [dsi-rls-performance-20261018]
permissions:
  contents: read
jobs:
  rls-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate RLS SQL scope and access predicates
        run: python3 -m unittest discover -s tests -p test_dsi_rls_policy.py -v
