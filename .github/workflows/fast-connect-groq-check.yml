name: FAST Connect Groq Edge Function validation

on:
  push:
    branches: [fast-connect-groq-cloud-20261017]
    paths:
      - 'supabase/functions/fast-connect-groq/**'
      - '.github/workflows/fast-connect-groq-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deno-typecheck:
    name: Deno typecheck and privacy guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/fast-connect-groq/index.ts
      - name: Static requirements
        run: |
          set -euo pipefail
          FILE=supabase/functions/fast-connect-groq/index.ts
          grep -q 'GROQ_API_KEY' "$FILE"
          grep -q 'api.groq.com/openai/v1/chat/completions' "$FILE"
          grep -q 'secret_detected_no_external_transfer' "$FILE"
          grep -q 'request_owner_required' "$FILE"
          grep -q 'original_message_not_authorized' "$FILE"
          grep -q 'pending' "$FILE"
          if grep -Eq '(method|method:)[[:space:]]*[=:][[:space:]]*["\x27](DELETE|TRUNCATE)' "$FILE"; then
            echo "::error::Destructive HTTP method not allowed"; exit 1
          fi
