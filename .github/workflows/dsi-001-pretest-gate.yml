name: DSI-001 Pretest Contract Gate
on:
  pull_request:
    branches: [main, dsi-realtime-groq-20261018]
permissions:
  contents: read
jobs:
  pretest-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c8af683 # v4.2.2
      - name: Validate pretests and evidence gate
        run: python3 -m unittest discover -s tests -p test_dsi_pretest.py -v
      - name: Retain existing Groq bridge regression tests
        run: python3 -m unittest discover -s tests -p test_dsi_realtime.py -v
      - name: Summarize inspected commit (not incident-level attestation)
        if: always()
        run: |
          echo "DSI-001 code-gate run on commit ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "CI run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Incident-level proofs are separately stored in dsi_ops.pretest_results by a trusted integrator." >> "$GITHUB_STEP_SUMMARY"
