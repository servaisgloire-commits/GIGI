name: DSI ChatGPT code review
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
permissions:
  contents: read
concurrency:
  group: chatgpt-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    name: ChatGPT review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base code only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - name: Independent GPT review of exact PR head commit
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_REVIEW_MODEL: ${{ vars.OPENAI_REVIEW_MODEL || 'gpt-5.1' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: python3 tools/dsi_chatgpt_review.py
