name: FAST Verified CI to Vercel Deployment
on:
  workflow_run:
    workflows: ["FAST Production Gate"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: fast-vercel-deploy-main
  cancel-in-progress: false
jobs:
  deploy-production:
    name: Deploy verified source to existing Vercel project
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && vars.ENABLE_VERCEL_AUTO_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - root: backend
            project: prj_fFq7tf0gmVRerxi1bYNzloFh8L1l
            name: fast-n1-python-api
    env:
      VERCEL_ORG_ID: team_ikooiav5lkWrGTZIY05wYg0n
      VERCEL_PROJECT_ID: ${{ matrix.project }}
    defaults:
      run:
        working-directory: ${{ matrix.root }}
    steps:
      - name: Verify authorization exists without exposing credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "Vercel deploy disabled: VERCEL_TOKEN is missing in protected GitHub Actions secrets" >&2; exit 1; fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Verify exact commit SHA and intended application root
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.workflow_run.head_sha }}"
          test -f vercel.json
          echo "Validated ${{ matrix.name }} on GitHub SHA $(git rev-parse HEAD)"
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Build exact verified source in CI
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          vercel pull --yes --environment=production
          vercel build --prod
      - name: Deploy prebuilt source to existing Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          vercel deploy --prebuilt --prod
      - name: Record deployment provenance
        run: echo "Deployment target ${{ matrix.name }} / source ${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_STEP_SUMMARY"
