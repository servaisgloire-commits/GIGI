name: Deploy FAST Python API

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-preview:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_ikooiav5lkWrGTZIY05wYg0n
      VERCEL_PROJECT_ID: prj_fFq7tf0gmVRerxi1bYNzloFh8L1l
    outputs:
      preview_url: ${{ steps.deploy.outputs.preview_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify backend Python syntax
        run: python -m compileall -q backend/app backend/api

      - name: Run backend tests
        run: |
          pip install -q -r backend/requirements.txt pytest
          python -m pytest -q backend/tests
        env:
          PYTHONPATH: ${{ github.workspace }}/backend

      - name: Require Vercel authorization
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo '::error::VERCEL_TOKEN absent. Preview deployment is mandatory before FAST production.'
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link FAST API project
        shell: bash
        run: |
          mkdir -p backend/.vercel
          printf '%s\n' "{\"orgId\":\"$VERCEL_ORG_ID\",\"projectId\":\"$VERCEL_PROJECT_ID\"}" > backend/.vercel/project.json

      - name: Deploy FAST API preview
        id: deploy
        shell: bash
        run: |
          PREVIEW_URL="$(vercel deploy --yes --token "$VERCEL_TOKEN" --cwd backend)"
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "FAST backend preview: $PREVIEW_URL"

      - name: Verify preview API
        shell: bash
        run: |
          URL='${{ steps.deploy.outputs.preview_url }}'
          for i in 1 2 3 4 5 6; do
            BODY="$(curl -fsSL "$URL/health" || true)"
            if grep -q '"ok"' <<<"$BODY"; then
              echo "$BODY"
              exit 0
            fi
            sleep 5
          done
          echo 'FAST API preview health check failed'
          exit 1

      - name: Production promotion guard
        run: |
          echo 'Preview verified. Production promotion remains intentionally disabled until ERP go-live validation is fully green.'
