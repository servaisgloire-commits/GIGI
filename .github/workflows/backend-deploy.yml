name: Deploy FAST Python API

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      FAST_API_URL: https://fast-n1-python-api.vercel.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify backend Python syntax
        run: |
          python -m compileall -q backend/app backend/api

      - name: Run backend tests
        run: |
          pip install -q -r backend/requirements.txt pytest
          python -m pytest -q backend/tests
        env:
          PYTHONPATH: ${{ github.workspace }}/backend

      - name: Ensure Vercel authorization is available
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN" || { echo 'Missing VERCEL_TOKEN GitHub secret'; exit 1; }

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link FAST API project
        shell: bash
        run: |
          mkdir -p backend/.vercel
          printf '%s\n' '{"orgId":"team_ikooiav5lkWrGTZIY05wYg0n","projectId":"prj_fFq7tf0gmVRerxi1bYNzloFh8L1l"}' > backend/.vercel/project.json

      - name: Deploy FAST API to production
        run: vercel deploy --prod --yes --token "$VERCEL_TOKEN" --cwd backend

      - name: Verify production API
        shell: bash
        run: |
          for i in 1 2 3 4 5 6; do
            BODY="$(curl -fsSL "$FAST_API_URL/health" || true)"
            if grep -q '"ok"' <<<"$BODY"; then
              echo "$BODY"
              exit 0
            fi
            sleep 5
          done
          echo 'FAST API production health check failed'
          exit 1
