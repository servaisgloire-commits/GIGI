name: FAST Connect Android APK
on:
  push:
    branches: [fast-connect-apk-20261016]
    paths:
      - 'fast-connect-android/**'
      - '!fast-connect-android/dist/**'
      - '.github/workflows/fast-connect-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-connect-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Verify FAST Connect HTTPS and Supabase Auth connections
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --show-error --silent --retry 3 --retry-all-errors --max-time 25 \
            https://fast-n1-connect.vercel.app/ -o /tmp/fast-connect-index.html
          grep -qi 'FAST Connect' /tmp/fast-connect-index.html
          for path in auth/v1/health rest/v1/fast_discussion_agents?select=code; do
            http="$(curl --silent --show-error --retry 3 --retry-all-errors \
              --max-time 25 -o /dev/null -w '%{http_code}' \
              "https://hmwxwzfcpdvgzjgxruup.supabase.co/$path")"
            echo "Supabase endpoint ${path%%\?*}: HTTP $http"
            case "$http" in
              200|401|403) ;;
              *) echo "::error::Supabase endpoint unavailable or unexpected HTTP $http"; exit 1 ;;
            esac
          done
      - name: Verify Android host, network permissions and WebView safety
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'https://fast-n1-connect.vercel.app/' fast-connect-android/app/src/main/java/com/fastn1/connect/MainActivity.java
          grep -q "applicationId 'com.fastn1.connect'" fast-connect-android/app/build.gradle
          grep -q 'android.permission.INTERNET' fast-connect-android/app/src/main/AndroidManifest.xml
          grep -q 'usesCleartextTraffic="false"' fast-connect-android/app/src/main/AndroidManifest.xml
          grep -q 'setWebContentsDebuggingEnabled(false)' fast-connect-android/app/src/main/java/com/fastn1/connect/MainActivity.java
          grep -q 'handler.cancel()' fast-connect-android/app/src/main/java/com/fastn1/connect/MainActivity.java
          if grep -q 'addJavascriptInterface' fast-connect-android/app/src/main/java/com/fastn1/connect/MainActivity.java; then
            echo '::error::Unexpected JavaScript bridge'; exit 1
          fi
      - name: Build debug-signed APK
        working-directory: fast-connect-android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify Android APK integrity, signature and version
        shell: bash
        run: |
          set -euo pipefail
          apk=fast-connect-android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          signer="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$signer" verify --verbose --print-certs "$apk" | head -10
          "$aapt" dump badging "$apk" | grep '^package:' | tee /tmp/connect-badging.txt
          grep -q "name='com.fastn1.connect'" /tmp/connect-badging.txt
          grep -q "versionCode='2'" /tmp/connect-badging.txt
          grep -q "versionName='1.1.0-test'" /tmp/connect-badging.txt
          ls -lh "$apk"
      - name: Verify installation and launch on Android 30 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -eu
            apk=fast-connect-android/app/build/outputs/apk/debug/app-debug.apk
            adb install "$apk"
            adb shell pm list packages | grep -F 'package:com.fastn1.connect'
            adb shell am start -W -n com.fastn1.connect/.MainActivity
            sleep 7
            adb shell pidof com.fastn1.connect
            adb logcat -d -s AndroidRuntime:E | grep -q 'FATAL EXCEPTION' && exit 1 || true
      - name: Print SHA-256
        run: sha256sum fast-connect-android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FAST-Connect-APK-Android
          path: fast-connect-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK on isolated Android branch for direct download
        run: |
          set -euo pipefail
          mkdir -p fast-connect-android/dist
          cp fast-connect-android/app/build/outputs/apk/debug/app-debug.apk fast-connect-android/dist/FAST-Connect-v1.1-tested.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f fast-connect-android/dist/FAST-Connect-v1.1-tested.apk
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build(fast-connect): publish installable Android test APK [skip ci]"
          git push origin HEAD:fast-connect-apk-20261016
