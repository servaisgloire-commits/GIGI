name: FAST Connect Android APK
on:
  push:
    branches: [fast-connect-apk-20261016]
    paths:
      - 'fast-connect-android/**'
      - '.github/workflows/fast-connect-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-connect-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug-signed APK
        working-directory: fast-connect-android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK exists
        run: |
          test -s fast-connect-android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh fast-connect-android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FAST-Connect-APK-Android
          path: fast-connect-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
