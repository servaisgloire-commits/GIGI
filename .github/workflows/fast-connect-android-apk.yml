name: FAST Connect Android APK
on:
  push:
    branches: [fast-connect-apk-20261016]
    paths:
      - 'fast-connect-android/**'
      - '!fast-connect-android/dist/**'
      - '.github/workflows/fast-connect-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-connect-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug-signed APK
        working-directory: fast-connect-android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK exists
        run: |
          test -s fast-connect-android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh fast-connect-android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FAST-Connect-APK-Android
          path: fast-connect-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK on isolated Android branch for direct download
        run: |
          set -euo pipefail
          mkdir -p fast-connect-android/dist
          cp fast-connect-android/app/build/outputs/apk/debug/app-debug.apk fast-connect-android/dist/FAST-Connect-v1.0-test.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f fast-connect-android/dist/FAST-Connect-v1.0-test.apk
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build(fast-connect): publish installable Android test APK [skip ci]"
          git push origin HEAD:fast-connect-apk-20261016
