name: FAST Android Preproduction Compile

on:
  push:
    branches: [ audit-driver-flow-concurrency-20260913 ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-preproduction-compile.yml'

permissions:
  contents: read

jobs:
  compile-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile Android debug APK
        env:
          FAST_SUPABASE_URL: https://hmwxwzfcpdvgzjgxruup.supabase.co
          FAST_SUPABASE_PUBLISHABLE_KEY: test-publishable-key-for-compile-only
          FAST_PYTHON_API_URL: https://fast-n1-python-api.vercel.app
          FAST_GOOGLE_MAPS_API_KEY: test-key-for-compile-only
        run: gradle :app:assembleDebug --no-daemon --stacktrace
